<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline Field Manual</title>
<meta name="description" content="Offline guided walkthrough of the 7-tool design pipeline (FigJam, Eraser.io, Bruno, Figma, Prisma Studio, Plane, Code + Sentry) with project audits stored in localStorage. Schema: project-audit v1.">
<style>
:root {
  --bg: #f6f6f3;
  --surface: #ffffff;
  --surface-2: #efefea;
  --text: #1c1c1a;
  --muted: #5d5d57;
  --border: #dcdcd5;
  --accent: #2b55c9;
  --accent-weak: #e5ebfa;
  --accent-text: #ffffff;
  --ok: #1d7549;
  --ok-weak: #e1f2e8;
  --warn: #9a5c00;
  --warn-weak: #fbefd9;
  --bad: #b3261e;
  --bad-weak: #fbe4e2;
  --neutral: #6a6a64;
  --neutral-weak: #ececE7;
  --code-bg: #f1f1ec;
  --shadow: 0 1px 2px rgba(0,0,0,.06);
  --radius: 10px;
  --topbar-h: 54px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131312; --surface: #1b1b19; --surface-2: #242421; --text: #ebebe7; --muted: #a2a29b;
    --border: #34342f; --accent: #86a4f7; --accent-weak: #1f2944; --accent-text: #0d1430;
    --ok: #61c592; --ok-weak: #15301f; --warn: #e3a94d; --warn-weak: #35270f; --bad: #f2867b; --bad-weak: #3a1714;
    --neutral: #a3a39c; --neutral-weak: #2a2a27; --code-bg: #171715; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131312; --surface: #1b1b19; --surface-2: #242421; --text: #ebebe7; --muted: #a2a29b;
  --border: #34342f; --accent: #86a4f7; --accent-weak: #1f2944; --accent-text: #0d1430;
  --ok: #61c592; --ok-weak: #15301f; --warn: #e3a94d; --warn-weak: #35270f; --bad: #f2867b; --bad-weak: #3a1714;
  --neutral: #a3a39c; --neutral-weak: #2a2a27; --code-bg: #171715; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 var(--sans); }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.25; margin: 1.2em 0 .5em; }
h1 { font-size: 1.7rem; margin-top: .2em; }
h2 { font-size: 1.2rem; margin: 0; }
h3 { font-size: 1.02rem; }
h4 { font-size: .95rem; }
p, ul, ol { margin: .5em 0 .8em; }
li { margin: .2em 0; }
code { font-family: var(--mono); font-size: .88em; background: var(--code-bg); padding: .08em .35em; border-radius: 4px; border: 1px solid var(--border); }
kbd { font-family: var(--mono); font-size: .82em; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 .35em; background: var(--surface); }
table { border-collapse: collapse; width: 100%; margin: .6em 0 1em; font-size: .92rem; }
th, td { border: 1px solid var(--border); padding: .4em .55em; text-align: left; vertical-align: top; }
th { background: var(--surface-2); font-weight: 600; }
td code { white-space: nowrap; }
.table-wrap { overflow-x: auto; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- header ---------- */
.topbar { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.brand { font-weight: 700; letter-spacing: .01em; margin-right: 4px; white-space: nowrap; }
.brand small { font-weight: 500; color: var(--muted); }
.group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.group label.lbl { font-size: .8rem; color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: .86rem; line-height: 1.3; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 2px 8px; font-size: .78rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
select.ctl, input.ctl { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 8px; font-size: .88rem; max-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; font-size: .86rem; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.spacer { flex: 1; }
#menuToggle { display: none; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - var(--topbar-h)); }
nav#sidebar { border-right: 1px solid var(--border); background: var(--surface); padding: 14px 10px 40px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); overflow-y: auto; }
main#main { padding: 22px 28px 80px; max-width: 980px; width: 100%; }
.nav-sec { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 8px 6px; }
.nav-item { display: block; text-decoration: none; color: var(--text); padding: 8px 10px; border-radius: 8px; margin: 2px 0; border: 1px solid transparent; position: relative; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--accent-weak); border-color: var(--accent); }
.nav-item.active .nav-title { padding-right: 82px; }
.nav-item.active::before { content: "You are here"; position: absolute; right: 8px; top: 7px; font-size: .66rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
.nav-title { display: flex; gap: 8px; align-items: baseline; font-weight: 600; font-size: .93rem; }
.nav-num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); font-size: .74rem; font-weight: 700; flex: none; }
.nav-item.active .nav-num { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.nav-meta { display: flex; gap: 8px; align-items: center; margin: 5px 0 0 30px; font-size: .74rem; color: var(--muted); }
.bar { flex: 1; height: 6px; background: var(--surface-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
.bar > span { display: block; height: 100%; background: var(--ok); }

/* ---------- pills ---------- */
.pill { display: inline-block; font-size: .72rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.Matches { color: var(--ok); background: var(--ok-weak); }
.pill.Partial { color: var(--warn); background: var(--warn-weak); }
.pill.Missing { color: var(--bad); background: var(--bad-weak); }
.pill.Not-planned { color: var(--neutral); background: var(--neutral-weak); }
.pill.high { color: var(--bad); background: var(--bad-weak); }
.pill.medium { color: var(--warn); background: var(--warn-weak); }
.pill.low { color: var(--neutral); background: var(--neutral-weak); }

/* ---------- content ---------- */
.hero { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
.hero .kicker { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.hero .sub { color: var(--muted); margin: .2em 0 0; }
.hero .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { font-size: .8rem; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px 12px; margin: 0 0 14px; box-shadow: var(--shadow); }
.card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; }
.card-head h2 { display: flex; gap: 8px; align-items: baseline; }
.card-head .tag { font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.callout { border-left: 4px solid var(--accent); background: var(--accent-weak); padding: 8px 12px; border-radius: 0 8px 8px 0; margin: .8em 0; }
.callout.warn { border-color: var(--warn); background: var(--warn-weak); }
.callout.bad { border-color: var(--bad); background: var(--bad-weak); }
.callout.ok { border-color: var(--ok); background: var(--ok-weak); }
.callout > :first-child { margin-top: 0; }
.callout > :last-child { margin-bottom: 0; }
.analogy::before { content: "Analogy: "; font-weight: 700; }
ol.steps { counter-reset: step; list-style: none; padding-left: 0; }
ol.steps > li { counter-increment: step; position: relative; padding: 6px 0 6px 40px; border-bottom: 1px dashed var(--border); }
ol.steps > li:last-child { border-bottom: 0; }
ol.steps > li::before { content: counter(step); position: absolute; left: 0; top: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); border: 1px solid var(--accent); display: grid; place-items: center; font-size: .78rem; font-weight: 700; }
.flow { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; gap: 8px; align-items: stretch; margin: .6em 0; }
.flow .box { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); font-size: .9rem; }
.flow .box.me { border-color: var(--accent); background: var(--accent-weak); }
.flow .box b { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.flow .arrow { align-self: center; color: var(--muted); font-weight: 700; }
.pipeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: .8em 0; }
.pipeline a { display: block; text-decoration: none; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; background: var(--surface-2); }
.pipeline a:hover { border-color: var(--accent); }
.pipeline a .n { font-size: .72rem; font-weight: 700; color: var(--accent); }
.pipeline a .t { font-weight: 600; display: block; }
.pipeline a .o { font-size: .8rem; color: var(--muted); display: block; }
dl.terms { margin: 0; display: grid; grid-template-columns: minmax(130px, 210px) 1fr; gap: 6px 14px; }
dl.terms dt { font-weight: 600; }
dl.terms dd { margin: 0; color: var(--text); }
.who-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.who-grid > div { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--surface-2); }
.who-grid b { display: block; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }

/* ---------- code blocks ---------- */
.codeblock { border: 1px solid var(--border); border-radius: 8px; margin: .6em 0 1em; background: var(--code-bg); overflow: hidden; }
.codeblock .cb-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; border-bottom: 1px solid var(--border); font-size: .76rem; color: var(--muted); background: var(--surface-2); }
.codeblock pre code { background: none; border: 0; padding: 0; font-size: inherit; border-radius: 0; }
.codeblock pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 12.8px/1.5 var(--mono); white-space: pre; tab-size: 2; }

/* ---------- forms ---------- */
.q { margin: 0 0 14px; }
.q label { display: block; font-weight: 600; margin-bottom: 4px; font-size: .93rem; }
.q .hint { font-weight: 400; color: var(--muted); font-size: .82rem; }
textarea.inp, input.inp, select.inp { width: 100%; border: 1px solid var(--border); background: var(--bg); border-radius: 8px; padding: 7px 9px; font-size: .9rem; }
textarea.inp { min-height: 64px; resize: vertical; }
textarea.mono, input.mono { font-family: var(--mono); font-size: .82rem; }
textarea.inp:focus, input.inp:focus, select.inp:focus, select.ctl:focus, input.ctl:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.pvb { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { margin-bottom: 12px; }
.field > label { display: block; font-weight: 600; font-size: .86rem; margin-bottom: 3px; }
.field .hint { font-size: .78rem; color: var(--muted); }
.statusrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.rulehint { font-size: .84rem; }
.rulehint.mismatch { color: var(--warn); font-weight: 600; }
.gap-row, .art-row { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--bg); }
.gap-grid { display: grid; grid-template-columns: 150px 110px 1fr; gap: 8px; }
.gap-grid2 { display: grid; grid-template-columns: 1fr 140px auto auto; gap: 8px; align-items: center; margin-top: 6px; }
.art-grid { display: grid; grid-template-columns: 1fr 140px 1fr auto auto; gap: 8px; align-items: center; margin-bottom: 6px; }
.dod { list-style: none; padding-left: 0; }
.dod li { padding: 4px 0; }
.dod label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.dod input { margin-top: 5px; width: 16px; height: 16px; flex: none; }
.navfoot { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.navfoot a { flex: 1; min-width: 220px; text-decoration: none; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 12px 14px; color: var(--text); }
.navfoot a:hover { border-color: var(--accent); }
.navfoot a.next { text-align: right; border-color: var(--accent); }
.navfoot small { display: block; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; }
.navfoot b { font-size: 1.05rem; }
.copying .btn { display: none !important; }
.issues li.err { color: var(--bad); }
.issues li.warn { color: var(--warn); }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: .88rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
.toast.show { opacity: 1; }
dialog { border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); width: min(760px, calc(100vw - 32px)); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
.sum-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface); }
.stat .v { font-size: 1.5rem; font-weight: 700; }
.stat .k { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.storymap { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 6px; font-size: .8rem; min-width: 640px; }
.storymap .act { background: #f6d860; color: #222; font-weight: 700; padding: 6px; border-radius: 4px; }
.storymap .task { background: #9fc5f8; color: #111; padding: 6px; border-radius: 4px; }
.storymap .story { background: #b6e3b6; color: #111; padding: 6px; border-radius: 4px; }
.storymap .later { background: #d9d9d4; color: #333; padding: 6px; border-radius: 4px; }
.storymap .cut { grid-column: 1 / -1; border-top: 3px dashed var(--bad); color: var(--bad); font-weight: 700; font-size: .75rem; padding-top: 2px; }

/* stack-specific content */
body[data-stack="JS"] [data-only]:not([data-only~="JS"]),
body[data-stack="TS"] [data-only]:not([data-only~="TS"]),
body[data-stack="Python"] [data-only]:not([data-only~="Python"]) { display: none !important; }
.stack-badge { font-size: .7rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; background: var(--accent-weak); color: var(--accent); border: 1px solid var(--accent); margin-right: 6px; }

@media (max-width: 900px) {
  .topbar { position: static; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  nav#sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 290px; height: 100vh; z-index: 30; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 30px rgba(0,0,0,.25); padding-top: 18px; }
  body.menu-open nav#sidebar { transform: none; }
  #menuToggle { display: inline-block; }
  main#main { padding: 16px 16px 70px; }
  .pvb, .gap-grid, .gap-grid2, .art-grid { grid-template-columns: 1fr; }
  .flow { grid-template-columns: 1fr; }
  .flow .arrow { transform: rotate(90deg); justify-self: center; }
  dl.terms { grid-template-columns: 1fr; }
  dl.terms dd { margin-bottom: 8px; }
  select.ctl { max-width: 160px; }
}
@media print {
  .topbar, nav#sidebar, .navfoot, .btn { display: none !important; }
  .layout { display: block; }
}
</style>
</head>
<body data-stack="TS">
<header class="topbar">
  <button class="btn" id="menuToggle" aria-label="Open navigation">☰</button>
  <span class="brand">Field Manual <small>· 7-tool pipeline</small></span>
  <div class="group">
    <label class="lbl" for="projectSelect">Project</label>

  <div class="group">
    <span class="lbl">Stack</span>
    <div class="seg" role="group" aria-label="Stack">
      <button data-stack-btn="JS" aria-pressed="false">JS</button>
      <button data-stack-btn="TS" aria-pressed="true">TS</button>
      <button data-stack-btn="Python" aria-pressed="false">Python</button>
    </div>

  <div class="spacer"></div>
  <div class="group">

<dialog id="importDialog">
  <h2 style="margin-bottom:.4em">Import audit JSON (schemaVersion 1)</h2>
  <p class="small muted">Choose a <code>.audit.json</code> file or paste JSON produced by the Reverse-Engineering Prompt. Structural errors block the import. Rule warnings don't block it; they're shown so you can fix them.</p>
  <div class="field"><input type="file" id="importFile" accept=".json,application/json"></div>
  <div class="field"><textarea class="inp mono" id="importText" rows="12" placeholder='{ "schemaVersion": 1, "project": { ... }, "tools": { ... } }'></textarea></div>
  <div id="importReport"></div>

</dialog>

<!-- ===================== START ===================== -->
<template id="t-start">
<div class="hero">
  <div class="kicker">Start here</div>
  <h1>Your 7-tool design pipeline, one step at a time</h1>
  <p class="sub">This manual walks you through every tool in order. Each step tells you what to make, which buttons to click, how to recover the same artifact from existing code, and exactly what to hand to the next tool.</p>
  <div class="chips"><span class="chip">Works offline</span><span class="chip">Saves to this browser (localStorage)</span><span class="chip">Import/Export: project-audit schema v1</span></div>
  <p style="margin-top:14px"><a class="btn primary" href="#/tool/figjam">Start here: FigJam →</a>
  <button class="btn" data-action="load-example">Load the LendLoop worked example</button>
  <button class="btn" data-action="import">Import an audit JSON</button>
  <a class="btn" href="#/project">Set up this project</a></p>
</div>

<section class="card" data-sec="modes">
  <h2>Two ways to use this manual</h2>
  <div class="who-grid">
    <div><b>Forward mode (new project)</b>Go through the steps in order. In each step, write your design into <em>Planned</em>, create the artifact in the tool, and tick the Definition of Done. <em>Built</em> stays empty until you write code.</div>
    <div><b>Reverse mode (existing project)</b>For each step, run the <em>Recover from code</em> commands to fill <em>Built</em>. Use README, docs, TODOs, issues, and commits to fill <em>Planned</em>. Every difference between the two is a <em>gap</em>. Or import the JSON your AI agent produced with the Reverse-Engineering Prompt.</div>
  </div>
  <p class="callout"><strong>Reverse-engineering</strong> means reconstructing the design of something from the thing itself. Here, that means rebuilding your story map, ERD, contracts, and the rest from your repo. It works like an architect producing "as-built" drawings of a house that was built without blueprints.</p>
</section>

<section class="card" data-sec="pipeline">
  <h2>The pipeline and what each step hands to the next</h2>
  <div class="pipeline">
    <a href="#/tool/figjam"><span class="n">STEP 1</span><span class="t">FigJam</span><span class="o">Story map + MVP cut-line → nouns, verbs, MVP stories</span></a>
    <a href="#/tool/eraser"><span class="n">STEP 2</span><span class="t">Eraser.io</span><span class="o">ERD + API contracts → endpoint list with payloads</span></a>
    <a href="#/tool/bruno"><span class="n">STEP 3</span><span class="t">Bruno</span><span class="o">.bru collection → real response shapes + error codes</span></a>
    <a href="#/tool/figma"><span class="n">STEP 4</span><span class="t">Figma</span><span class="o">4 states per screen → data scenarios to seed</span></a>

<!-- ===================== 1. FIGJAM ===================== -->
<template id="t-figjam">
<section class="card" data-sec="what">
  <h2>What</h2>
  <p>A <strong>user story map</strong> on a FigJam board. It's a two-dimensional map of your product, seen from the user's side:</p>
  <ul>
    <li><strong>Horizontal axis = time.</strong> The top row is the <strong>backbone</strong>: the big <strong>activities</strong> a user goes through, left to right in the order they happen (Join → Share → Discover → Borrow → Return).</li>
    <li><strong>Under each activity:</strong> the <strong>user tasks</strong>, meaning the concrete steps inside that activity (Browse catalog, View tool detail).</li>
    <li><strong>Under each task:</strong> the <strong>user stories</strong>, which are small, buildable slices of behavior, stacked with the most important on top.</li>
    <li><strong>The MVP cut-line:</strong> a horizontal line across the whole map. Everything above it ships first. Everything below it waits.</li>
  </ul>
  <p>The artifact you hand off is the board (link) plus a text outline of the same map. The outline is the source of truth that travels into every later tool.</p>
</section>

<section class="card" data-sec="why">
  <h2>Why</h2>
  <p>A backlog list is one-dimensional. It tells you <em>what</em> but not <em>when in the user's journey</em>. Solo developers usually build in the order ideas arrive. You end up with a polished settings page and no way for a user to finish the core loop. The story map forces you to build a <strong>walking skeleton</strong>: the thinnest version of the product that works end to end, with one story from every activity, before you thicken any single part.</p>
  <p class="analogy">A story map is the table of contents of a book you haven't written yet. The cut-line decides what goes into the first edition. Writing chapter 7 in full detail before chapter 2 exists doesn't give you a book.</p>
  <div class="callout bad"><p><strong>What breaks downstream if you skip it:</strong></p>
  <ul>
    <li><strong>Eraser.io:</strong> without a fixed MVP story list, you model every entity you can imagine. The ERD bloats and migrations follow it.</li>
    <li><strong>Bruno:</strong> there's no defined set of endpoints, so there's no defined set of tests and coverage becomes "whatever I remembered".</li>
    <li><strong>Figma:</strong> you don't know which screens are key, so you design screens that never ship.</li>
    <li><strong>Plane:</strong> tickets have no priority logic. Everything looks equally urgent.</li>
  </ul></div>
</section>

<section class="card" data-sec="who">
  <h2>Who</h2>
  <div class="who-grid">
    <div><b>Owner: Product Manager</b>Decides the activities, the order, and where the cut-line goes.</div>
    <div><b>Facilitator: Product Designer</b>Runs the mapping session and keeps the language user-centered (verbs the user would say).</div>
    <div><b>Contributor: Tech Lead</b>Flags expensive stories and technical dependencies before the cut-line is final.</div>
    <div><b>Solo you</b>You wear the PM hat. Timebox it to 60 minutes so it doesn't turn into procrastination.</div>
  </div>
</section>

<section class="card" data-sec="where">
  <h2>Where it fits</h2>
  <div class="flow">
    <div class="box"><b>Input</b>Problem statement, target user, README/pitch. In reverse mode, also the list of pages/routes and the commit history.</div>
    <div class="arrow">→</div>
    <div class="box me"><b>This step: FigJam</b>Backbone → tasks → stories, with the MVP cut-line.</div>
    <div class="arrow">→</div>
    <div class="box"><b>Output → Eraser.io</b>The MVP story list, the <em>nouns</em> in it (candidate entities), and the <em>verbs</em> (candidate endpoints).</div>
  </div>
</section>

<section class="card" data-sec="steps">
  <h2>Inside the tool</h2>
  <ol class="steps">
    <li>Go to <strong>figma.com</strong>. Open your team or <em>Drafts</em>, then click <strong>+ Create new</strong> (or the <strong>New</strong> menu) and choose <strong>FigJam board</strong>.</li>
    <li>Click the file name at the top center and rename it to <code>[Project] — Story Map</code>.</li>
    <li>Press <kbd>T</kbd> (Text) and type at the top left: <code>Persona: [Name], [context]. Goal: [one sentence].</code> Example: <em>Persona: Maya, renter in a 40-unit building. Goal: borrow a drill for one afternoon without buying one.</em></li>
    <li>Press <kbd>Shift</kbd>+<kbd>S</kbd> (Section tool) and drag a wide, short section across the board. Double-click its title and name it <code>Backbone</code>.</li>
    <li>Press <kbd>S</kbd> (Sticky note), choose <strong>yellow</strong> in the color bar, and click inside <em>Backbone</em>. Add <strong>one sticky per user activity</strong>, written as a verb phrase the user would say ("Find a tool", not "Search module"). Place them <strong>left to right in the order the user experiences them</strong>. Aim for 4–7.</li>
    <li>Create a second section directly below, named <code>Tasks</code>. Under each activity, add <strong>blue</strong> stickies for that activity's user tasks, left to right in order. Keep every task horizontally under its parent activity. That vertical alignment is the "map".</li>
    <li>Create a third section below, named <code>Stories</code>. Under each task, stack <strong>green</strong> stickies, one per story. Use either <code>As a [role], I want [action] so that [outcome]</code> or a short form like "See which tools are available now". <strong>Put the most important story at the top</strong> of each column.</li>
    <li>Draw the <strong>MVP cut-line</strong>. From the toolbar, pick the connector/line tool, hold <kbd>Shift</kbd>, and drag a straight horizontal line across <em>all</em> story columns. Set the stroke to red and thick, and add a text label <code>MVP cut-line</code> at its left end.</li>
    <li>Move stories above or below the line until <strong>every activity has at least one story above it</strong>. That set of stories above the line is your walking skeleton. Anything you're cutting goes below. Optionally draw a second line labeled <code>Release 2</code>.</li>
    <li>Add <strong>pink</strong> stickies for open questions and risks ("What happens if a tool is never returned?"). Place each next to the story it affects.</li>
    <li>Press <kbd>X</kbd> (Connector) and draw arrows for hard dependencies between stories (for example "List a tool" → "Borrow a tool").</li>
    <li>Right-click the <em>Backbone</em> section and choose <strong>Lock</strong> so you can't nudge it by accident.</li>
    <li>Type the map as an outline into <em>Planned</em> below, using the outline format from the worked example. In reverse mode, put the as-built journey into <em>Built</em>.</li>
    <li>Click <strong>Share</strong> → <strong>Copy link</strong> and paste the board URL into <em>Evidence</em>.</li>
  </ol>
  <p class="callout small">Color legend used throughout this manual: <strong>yellow</strong> = activity, <strong>blue</strong> = task, <strong>green</strong> = story, <strong>pink</strong> = question/risk, <strong>gray</strong> = deferred (below the cut-line).</p>
</section>

<section class="card" data-sec="questions">
  <h2>Guiding questions</h2>
  <div data-q="persona" data-hint="Name, context, one-sentence goal.">Who is the primary user, and what single job do they hire this app for?</div>
  <div data-q="activities" data-hint="Verb phrases, in time order. 4–7.">What are the backbone activities, left to right?</div>
  <div data-q="skeleton" data-hint="One story per activity.">What is the thinnest end-to-end path through every activity (the walking skeleton)?</div>
  <div data-q="cutline" data-hint="Name each deferred story and why.">What's above the cut-line, and what's explicitly deferred below it?</div>
  <div data-q="roles" data-hint="Admins, owners, vendors, helpers...">Which stories involve a second role, and does that role need its own backbone?</div>
  <div data-q="risk" data-hint="The assumption that, if wrong, kills the product.">What's the riskiest assumption in this backbone?</div>
  <div data-q="orphans" data-hint="Reverse mode: pages that map to no activity.">Which existing pages or routes don't map to any activity (dead or undocumented features)?</div>
</section>

<section class="card" data-sec="recover">
  <h2>Recover from code</h2>
  <p>The goal is to rebuild the <em>Built</em> journey from what's reachable in the app (pages, routes, server actions), and the <em>Planned</em> journey from what was written down (README, docs, issues, commit messages). Then map each page or route to a user task and group the tasks under activities.</p>
  <h3>Built: list every place a user can be</h3>
  <div data-only="TS">
    <script type="text/plain" class="code" data-lang="bash" data-title="Next.js (App Router)">
# every page.tsx = one screen a user can reach
find app -name 'page.tsx' -not -path '*/node_modules/*' | sort

# route groups (role areas) and dynamic segments (entities)
find app -type d \( -name '(*)' -o -name '[*]' \) | sort

# server actions = user tasks that change data
grep -rln "'use server'" app lib --include=*.ts --include=*.tsx

# Pages Router projects instead:
find pages -name '*.tsx' -not -name '_*' | sort
    </script>
  </div>
  <div data-only="JS">
    <script type="text/plain" class="code" data-lang="bash" data-title="Express / React (JavaScript)">
# server routes
grep -rnE "(app|router)\.(get|post|put|patch|delete)\(" src server routes --include=*.js

# client routes (React Router)
grep -rnE "<Route |path:\s*['\"]" src --include=*.jsx --include=*.js

# Next.js in JS: same as the TS commands, with page.jsx / page.js
find app -name 'page.js*' -not -path '*/node_modules/*' | sort
    </script>
  </div>
  <div data-only="Python">
    <script type="text/plain" class="code" data-lang="bash" data-title="FastAPI / Flask / Django">
# FastAPI: decorators
grep -rnE "@(app|router)\.(get|post|put|patch|delete)\(" --include=*.py .

# Flask: built-in route table
flask --app app routes

# Django: needs django-extensions in INSTALLED_APPS
python manage.py show_urls

# Server-rendered templates = screens
find . -path ./.venv -prune -o -name '*.html' -print | grep templates | sort
    </script>
  </div>
  <h3>Planned: what the project said it would do (all stacks)</h3>
  <script type="text/plain" class="code" data-lang="bash" data-title="Intent evidence">
# headings in README and docs = declared features
grep -n '^#' README.md docs/*.md 2>/dev/null

# commit subjects, oldest first = the order features were attempted
git log --reverse --date=short --format='%ad %h %s' | head -80

# TODO / FIXME = planned-but-not-built
grep -rnE "TODO|FIXME|HACK" --exclude-dir={node_modules,.git,.next,dist,.venv,__pycache__} .

# issues (requires the GitHub CLI)
gh issue list --state all --limit 100
  </script>
  <p><strong>Mapping rule:</strong> page or route → user task. Tasks that serve the same user goal → one activity. Order activities by the first commit that touched them. A page that fits no activity goes in the "orphans" answer above and usually becomes a gap.</p>
</section>

BACKBONE (left -> right)
1. Join

     - [MVP] Register with email + password
     - [Later] Sign in with Google

<section class="card" data-sec="terms">
  <h2>Key terms</h2>
  <dl class="terms">
    <dt>User story map</dt><dd>A 2D layout of user activities (left to right, in time order) and the stories under them (top to bottom, by priority). Coined by Jeff Patton.</dd>
    <dt>Backbone</dt><dd>The top row of the map: the essential user activities in narrative order. It rarely changes between releases.</dd>
    <dt>Activity</dt><dd>A big user goal made of several tasks ("Borrow").</dd>
    <dt>User task</dt><dd>A step the user takes inside an activity ("Request a loan").</dd>
    <dt>User story</dt><dd>A small, valuable, testable slice of behavior, often written "As a [role], I want [action] so that [outcome]".</dd>
    <dt>Walking skeleton</dt><dd>The thinnest implementation that works end to end through every activity. It's ugly but complete, and you grow it afterward.</dd>
    <dt>MVP</dt><dd>Minimum Viable Product: the smallest release that lets real users get the core job done and gives you real feedback.</dd>
    <dt>MVP cut-line</dt><dd>The horizontal line on the map. Stories above it are in the MVP, stories below are deferred.</dd>
    <dt>Release slice</dt><dd>A horizontal band of stories between two cut-lines that ships together.</dd>
    <dt>Persona</dt><dd>A specific, named archetype of your user. It stops you from designing for "everyone".</dd>
    <dt>Orphan feature</dt><dd>Code reachable in the app that maps to no activity. It's either undocumented scope or dead code.</dd>
  </dl>
</section>

<section class="card" data-sec="dod">
  <h2>Definition of Done</h2>
  <ul class="dod">
    <li data-dod="persona">Persona statement written on the board (name, context, one-sentence goal).</li>
    <li data-dod="backbone">4–7 activities as verb phrases, left to right in time order, inside a locked Backbone section.</li>
    <li data-dod="tasks">Every activity has at least one task, and every task has at least one story.</li>
    <li data-dod="skeleton">At least one story above the cut-line in <em>every</em> activity (walking skeleton complete).</li>
    <li data-dod="cutline">Cut-line drawn and labeled. Deferred stories sit explicitly below it.</li>
    <li data-dod="risks">Open questions and risks captured on pink stickies.</li>
    <li data-dod="outline">Outline typed into Planned (and Built, in reverse mode), with gaps logged.</li>
    <li data-dod="link">Board link saved in Evidence.</li>
  </ul>
</section>

<section class="card" data-sec="handoff">
  <h2>Handoff → Eraser.io</h2>
  <p>Take these three lists into Eraser.io:</p>
  <ol>
    <li><strong>MVP story list:</strong> every [MVP] line from the outline. This bounds the scope of the ERD and the API.</li>
    <li><strong>Noun list:</strong> underline every noun in the MVP stories. Each one becomes an entity, an attribute, or an enum in step 2.</li>
    <li><strong>Verb list:</strong> every verb in the MVP stories. Each one becomes a candidate endpoint (register → <code>POST /api/auth/register</code>).</li>
  </ol>
  <p>Also bring the open questions that are about data ("two people borrow at once"). Those become business rules in the ERD.</p>
</section>

<!-- ===================== 2. ERASER ===================== -->
<template id="t-eraser">
<section class="card" data-sec="what">
  <h2>What</h2>
  <p>One Eraser.io file containing two design artifacts, both written as <strong>diagram-as-code</strong> (text that renders into a diagram, so it can live in Git and show up in diffs):</p>
  <ol>
    <li><strong>ERD (Entity-Relationship Diagram):</strong> every entity (table), its attributes (columns) and types, its primary key, and every relationship between entities with its <strong>cardinality</strong> (1-to-1, 1-to-many, many-to-many).</li>
    <li><strong>API payload contracts:</strong> for every MVP endpoint, the method and path, auth requirement, request body, the response body for <em>each</em> status code, and the shared error format. A sequence diagram shows the core flow.</li>
  </ol>
</section>

<section class="card" data-sec="why">
  <h2>Why</h2>
  <p>The ERD makes you decide what's <em>stored</em> versus <em>computed</em>, who <em>owns</em> what, and which relationships exist, all before a migration makes those decisions expensive to change. Contracts let the frontend and backend agree on payloads before either side writes code, so Bruno has precise expectations to assert against.</p>
  <p class="analogy">The ERD is a building's floor plan: rooms (entities) and the doors between them (relationships). The API contract is the plumbing spec: the exact pipe diameter at every connection. If you build without the spec, each plumber picks their own diameter and the joints leak. In software, "leaks" are <code>undefined</code> fields and 500 errors.</p>
  <div class="callout bad"><p><strong>What breaks downstream if you skip it:</strong></p>
  <ul>
    <li><strong>Bruno:</strong> no contract means nothing to assert. Tests only check "status 200" and miss shape changes.</li>
    <li><strong>Figma:</strong> designers invent field names and error messages the API doesn't return.</li>
    <li><strong>Prisma:</strong> models drift from intent. Cardinality mistakes (1-1 instead of 1-N) need data migrations to fix later.</li>
    <li><strong>Code:</strong> each endpoint returns a different error shape, so the frontend needs special-case parsing everywhere.</li>
  </ul></div>
</section>

<section class="card" data-sec="who">
  <h2>Who</h2>
  <div class="who-grid">
    <div><b>Owner: Tech Lead / Backend Lead</b>Owns the data model and the API surface.</div>
    <div><b>Reviewer: Frontend Engineer</b>Signs off on contracts. They're the API's consumer.</div>
    <div><b>Reviewer: Solutions Architect</b>Checks ownership boundaries, consistency rules, and integration points.</div>
    <div><b>Solo you</b>Write it with a backend hat on, then review it with a frontend hat: "Can I render every screen from these responses?"</div>
  </div>
</section>

<section class="card" data-sec="where">
  <h2>Where it fits</h2>
  <div class="flow">
    <div class="box"><b>Input ← FigJam</b>MVP stories, noun list (→ entities), verb list (→ endpoints), data-related risks (→ business rules).</div>
    <div class="arrow">→</div>
    <div class="box me"><b>This step: Eraser.io</b>ERD with cardinality + contracts for each endpoint + error envelope.</div>
    <div class="arrow">→</div>
    <div class="box"><b>Output → Bruno</b>Endpoint table: method, path, auth, example request, expected status codes and response keys. The ERD also feeds step 5.</div>
  </div>
</section>

<section class="card" data-sec="steps">
  <h2>Inside the tool</h2>
  <ol class="steps">
    <li>Go to <strong>app.eraser.io</strong> and sign in. Click <strong>New File</strong> and name it <code>[Project] — Data &amp; API</code>.</li>

    <li>In the Document pane, add a heading <strong>API Contracts</strong>. For each MVP endpoint, add a code block (type <kbd>```</kbd>) with method + path, auth, headers, request JSON, and one response per status code.</li>

  <h3>Eraser ERD relationship operators</h3>
  <div class="table-wrap"><table>
    <tr><th>Operator</th><th>Meaning</th><th>Example (read aloud)</th></tr>
    <tr><td><code>&lt;</code></td><td>one-to-many</td><td><code>users.id &lt; tools.ownerId</code>: one user owns many tools</td></tr>
    <tr><td><code>&gt;</code></td><td>many-to-one</td><td><code>tools.ownerId &gt; users.id</code>: the same relationship written from the other side</td></tr>
    <tr><td><code>-</code></td><td>one-to-one</td><td><code>users.id - profiles.userId</code>: each user has exactly one profile</td></tr>
    <tr><td><code>&lt;&gt;</code></td><td>many-to-many</td><td><code>tools.id &lt;&gt; tags.id</code>: needs a join table when you implement it</td></tr>

<section class="card" data-sec="recover">
  <h2>Recover from code</h2>
  <p>Built ERD = what the <em>database and ORM</em> actually define. Built contracts = what the <em>handlers</em> actually read and return. Planned = whatever docs or diagrams exist (<code>docs/</code>, README tables, old Eraser/dbdiagram links).</p>
  <h3>ERD from the database / ORM</h3>
  <div data-only="JS TS">
    <script type="text/plain" class="code" data-lang="bash" data-title="Prisma, Drizzle, or raw Postgres">
# Prisma: print the schema introspected from the live DB (does not overwrite)
npx prisma db pull --print

# Drizzle: introspect the live DB into the configured out folder
npx drizzle-kit pull

# Find the ORM schema files to read directly
ls prisma/schema.prisma 2>/dev/null; grep -rln "pgTable\|sqliteTable\|mysqlTable" --include=*.ts . | grep -v node_modules

# Raw Postgres: tables, then every foreign key (= every relationship line)
psql "$DATABASE_URL" -c '\dt'
psql "$DATABASE_URL" -c "
SELECT tc.table_name, kcu.column_name, ccu.table_name AS references_table, ccu.column_name AS references_column
FROM information_schema.table_constraints tc
JOIN information_schema.key_column_usage kcu ON tc.constraint_name = kcu.constraint_name
JOIN information_schema.constraint_column_usage ccu ON ccu.constraint_name = tc.constraint_name
WHERE tc.constraint_type = 'FOREIGN KEY' ORDER BY 1;"
    </script>
  </div>
  <div data-only="Python">
    <script type="text/plain" class="code" data-lang="bash" data-title="SQLAlchemy / Alembic / Django">
# SQLAlchemy: generate model code from the live DB (pip install sqlacodegen)
sqlacodegen "$DATABASE_URL" > /tmp/inspected_models.py

# Alembic: migration chain = how the model evolved
alembic history --verbose

# Django: models introspected from the DB, plus an ERD image (django-extensions + pygraphviz)
python manage.py inspectdb > /tmp/inspected_models.py
python manage.py graph_models -a -o erd.png

# Raw Postgres foreign keys: same SQL query as in the JS/TS view
psql "$DATABASE_URL" -c '\d+'
    </script>
  </div>
  <h3>Contracts from the handlers</h3>
  <div data-only="TS">
    <script type="text/plain" class="code" data-lang="bash" data-title="Next.js route handlers + zod">
# route handlers and the HTTP methods they export
grep -rnE "export (async )?(function|const) (GET|POST|PUT|PATCH|DELETE)" app --include=route.ts

# request validation schemas (planned request contracts)
grep -rn "z\.object(" app lib --include=*.ts --include=*.tsx

# what responses actually look like
grep -rnE "(NextResponse|Response)\.json\(" app --include=*.ts

# status codes in use
grep -rnoE "status: [0-9]{3}" app --include=*.ts | sort | uniq -c
    </script>
  </div>
  <div data-only="JS">
    <script type="text/plain" class="code" data-lang="bash" data-title="Express handlers">
# what each handler reads from the request
grep -rnE "req\.(body|params|query)\.[a-zA-Z]+" src --include=*.js

# what it sends back
grep -rnE "res\.status\([0-9]+\)|res\.json\(" src --include=*.js

# validation in use (zod / joi / express-validator)
grep -rnE "z\.object\(|Joi\.object\(|body\('" src --include=*.js
    </script>
  </div>
  <div data-only="Python">
    <script type="text/plain" class="code" data-lang="bash" data-title="FastAPI / Pydantic / DRF">
# FastAPI publishes the built contract itself (run the app first)
curl -s http://localhost:8000/openapi.json | python -m json.tool > openapi.json

# Pydantic models = request/response contracts
grep -rn "class .*(BaseModel)" --include=*.py .

# Django REST Framework: serializers, plus an OpenAPI file if drf-spectacular is installed
grep -rn "class .*Serializer" --include=*.py .
python manage.py spectacular --file schema.yml
    </script>
  </div>
  <p><strong>Gap heuristics:</strong> a handler that reads <code>req.body.x</code> without validating it is a <em>missing request contract</em>. Two endpoints returning different error shapes are a <em>missing error envelope</em>. A foreign key column with no FK constraint is a <em>missing relationship</em>.</p>
</section>

<section class="card" data-sec="example">
  <h2>Worked example: LendLoop</h2>
  <p>The nouns from FigJam become: <strong>User</strong>, <strong>Tool</strong>, <strong>Loan</strong> (entities); <strong>Category</strong>, <strong>Condition</strong>, <strong>LoanStatus</strong> (enums); <strong>due date</strong> (an attribute of Loan). "Available" isn't stored. It's <em>derived</em>: a tool is available when it has no ACTIVE loan.</p>
  <script type="text/plain" class="code" data-lang="eraser" data-title="ERD (paste into an Entity Relationship diagram)">
title LendLoop data model

users [icon: user, color: blue] {
  id string pk
  email string
  name string
  passwordHash string
  createdAt timestamp
}

tools [icon: tool, color: green] {
  id string pk
  ownerId string
  name string
  description string
  category ToolCategory
  condition ToolCondition
  createdAt timestamp
}

loans [icon: repeat, color: orange] {
  id string pk
  toolId string
  borrowerId string
  status LoanStatus
  idempotencyKey string
  startedAt timestamp
  dueAt timestamp
  returnedAt timestamp
  createdAt timestamp
}

users.id < tools.ownerId
users.id < loans.borrowerId
tools.id < loans.toolId

  <h3>Business rules (Document pane)</h3>
  <ul>
    <li><code>users.email</code> is unique (DB unique index).</li>
    <li>A tool has <strong>at most one</strong> loan with status <code>ACTIVE</code> (DB partial unique index, added in step 5).</li>
    <li>You can't borrow your own tool (checked in the handler, returns 422 <code>OWN_TOOL</code>).</li>
    <li><code>loans.idempotencyKey</code> is unique per borrower. A replayed POST returns the original loan (handler + unique index).</li>
    <li>Deleting a user with tools or loans is <em>restricted</em> (no cascade). MVP has no account deletion.</li>
  </ul>
  <script type="text/plain" class="code" data-lang="eraser" data-title="Sequence: Borrow a tool (paste into a Sequence diagram)">
title Borrow a tool

Member [icon: user]
Web [icon: monitor]
API [icon: server]
DB [icon: database]

Member > Web: Click "Borrow" (due date picked)
Web > API: POST /api/loans + Idempotency-Key
API > DB: Find loan by (borrowerId, idempotencyKey)
alt [label: key already used] {
  API --> Web: 201 original Loan (replay)
}
else [label: new key] {
  API > DB: INSERT loan status=ACTIVE (unique active per tool)
  alt [label: unique violation] {
    API --> Web: 409 TOOL_UNAVAILABLE
  }
  else [label: inserted] {
    API --> Web: 201 Loan
  }
}
Web > Member: Show "Borrowed until <due date>"
  </script>
  <h3>Error envelope (all endpoints)</h3>
  <script type="text/plain" class="code" data-lang="json" data-title="Every non-2xx response">
{
  "error": {
    "code": "TOOL_UNAVAILABLE",
    "message": "This tool is already on loan.",
    "details": null
  }
}
  </script>
  <p>Error codes: <code>UNAUTHENTICATED</code> (401), <code>FORBIDDEN</code> (403), <code>NOT_FOUND</code> (404), <code>EMAIL_TAKEN</code> (409), <code>TOOL_UNAVAILABLE</code> (409), <code>VALIDATION_FAILED</code> (422, <code>details</code> = field errors), <code>OWN_TOOL</code> (422), <code>INTERNAL</code> (500).</p>
  <h3>API contracts (MVP)</h3>
  <script type="text/plain" class="code" data-lang="text" data-title="Contracts (Document pane, one block per endpoint)">
POST /api/auth/register          Auth: none
  Request  { "email": "maya@lendloop.test", "name": "Maya", "password": "min 10 chars" }
  201      { "id": "us_01", "email": "maya@lendloop.test", "name": "Maya" }
  409      EMAIL_TAKEN        422 VALIDATION_FAILED

POST /api/auth/login             Auth: none
  Request  { "email": "maya@lendloop.test", "password": "..." }
  200      { "token": "<JWT, 7d>", "user": { "id": "us_01", "name": "Maya" } }
  401      UNAUTHENTICATED (same message for wrong email or wrong password)

GET /api/tools?cursor=&limit=20   Auth: none
  200      { "items": [ { "id": "tl_01", "name": "Cordless drill", "category": "POWER",
                          "condition": "GOOD", "available": true,
                          "owner": { "id": "us_02", "name": "Leo" } } ],
             "nextCursor": "tl_21" | null }

GET /api/tools/:id               Auth: none
  200      Tool (same shape as an item, plus "description")
  404      NOT_FOUND

POST /api/tools                  Auth: Bearer
  Request  { "name": "Ladder 6ft", "description": "...", "category": "HAND", "condition": "FAIR" }
  201      Tool                  401 UNAUTHENTICATED   422 VALIDATION_FAILED

POST /api/loans                  Auth: Bearer   Header: Idempotency-Key: <uuid> (required)
  Request  { "toolId": "tl_01", "dueAt": "2026-11-06T18:00:00Z" }
  201      { "id": "ln_01", "toolId": "tl_01", "borrowerId": "us_01", "status": "ACTIVE",
             "startedAt": "...", "dueAt": "...", "returnedAt": null }
           (same key replayed -> 201 with the SAME loan id, no new row)
  409      TOOL_UNAVAILABLE      422 VALIDATION_FAILED | OWN_TOOL   404 NOT_FOUND (tool)

PATCH /api/loans/:id/return      Auth: Bearer (borrower only)
  200      Loan with status "RETURNED", returnedAt set
           (already returned -> 200 with the same loan: idempotent)
  403      FORBIDDEN (not the borrower)   404 NOT_FOUND

GET /api/me/loans?status=ACTIVE  Auth: Bearer
  200      { "items": [Loan + tool { id, name }], "nextCursor": null }
  </script>
  <h3>The request contract enforced in code</h3>
  <div data-only="TS">
    <script type="text/plain" class="code" data-lang="typescript" data-title="lib/contracts/loans.ts (zod)">
import { z } from "zod";

export const CreateLoanBody = z.object({
  toolId: z.string().min(1),
  dueAt: z.iso.datetime().refine((s) => new Date(s) > new Date(), "dueAt must be in the future"),
});
export type CreateLoanBody = z.infer<typeof CreateLoanBody>;

export type ApiError = {
  error: { code: string; message: string; details: unknown };
};
    </script>
  </div>
  <div data-only="JS">
    <script type="text/plain" class="code" data-lang="javascript" data-title="src/contracts/loans.js (zod)">
const { z } = require("zod");

const CreateLoanBody = z.object({
  toolId: z.string().min(1),
  dueAt: z.iso.datetime().refine((s) => new Date(s) > new Date(), "dueAt must be in the future"),
});

module.exports = { CreateLoanBody };
    </script>
  </div>
  <div data-only="Python">
    <script type="text/plain" class="code" data-lang="python" data-title="app/contracts/loans.py (Pydantic v2)">
from datetime import datetime, timezone
from typing import Any
from pydantic import BaseModel, field_validator


class CreateLoanBody(BaseModel):
    toolId: str
    dueAt: datetime

    @field_validator("dueAt")
    @classmethod
    def due_in_future(cls, v: datetime) -> datetime:
        if v <= datetime.now(timezone.utc):
            raise ValueError("dueAt must be in the future")
        return v


class ErrorBody(BaseModel):
    code: str
    message: str
    details: Any | None = None


class ApiError(BaseModel):
    error: ErrorBody
    </script>
  </div>
  <p><strong>Reverse-mode finding:</strong> <code>app/api/loans/route.ts:10</code> reads <code>toolId</code> and <code>dueAt</code> from the body with no schema. That's <code>GAP-ERASER-01</code> (high): a missing request contract lets invalid dates and unknown fields reach the database.</p>

<section class="card" data-sec="terms">
  <h2>Key terms</h2>
  <dl class="terms">
    <dt>ERD</dt><dd>Entity-Relationship Diagram: a picture of the data model showing entities, attributes, and relationships.</dd>
    <dt>Entity</dt><dd>A thing with its own identity and lifecycle that you store (User, Tool). Becomes a table.</dd>
    <dt>Attribute</dt><dd>A property of an entity (name, dueAt). Becomes a column.</dd>
    <dt>Primary key (PK)</dt><dd>The column that uniquely identifies a row (<code>id</code>).</dd>
    <dt>Foreign key (FK)</dt><dd>A column that points at another table's PK (<code>loans.toolId → tools.id</code>). The database guarantees the target exists.</dd>
    <dt>Cardinality</dt><dd>How many of one entity relate to how many of another: 1-1, 1-N, or N-M.</dd>
    <dt>Referential action</dt><dd>What happens to children when the parent is deleted or updated: CASCADE, RESTRICT, SET NULL.</dd>
    <dt>Derived field</dt><dd>A value computed from other data instead of stored (<code>available</code>). Storing it risks the two copies disagreeing.</dd>
    <dt>API contract</dt><dd>The agreed shape of requests and responses for an endpoint, including every status code.</dd>
    <dt>Error envelope</dt><dd>One consistent JSON shape for every error, so clients parse errors one way.</dd>
    <dt>Idempotency</dt><dd>Doing an operation twice has the same effect as doing it once. An <strong>Idempotency-Key</strong> header lets a client safely retry a POST.</dd>
    <dt>Cursor pagination</dt><dd>Paging by "give me items after this id" instead of "skip N rows". Stable when rows are inserted, and fast on large tables.</dd>
    <dt>Diagram-as-code</dt><dd>Diagrams written as text that a tool renders. Diffable, reviewable, and versioned in Git.</dd>
    <dt>Sequence diagram</dt><dd>Shows messages between actors over time (top to bottom), including alternative branches.</dd>
  </dl>
</section>

<template id="t-bruno">
<section class="card" data-sec="what">
  <h2>What</h2>
  <p>A <strong>Git-tracked API collection</strong>: a folder in your repo (for example <code>bruno/</code>) of plain-text <code>.bru</code> files, one per request, grouped into folders by resource (<code>auth/</code>, <code>tools/</code>, <code>loans/</code>). It also holds <strong>environments</strong> (local, ci, staging), <strong>request chaining</strong> (login saves a token that every other request reuses), and <strong>assertions/tests</strong> on every response. The <code>bru</code> CLI runs the whole folder headless in CI.</p>
</section>

<section class="card" data-sec="why">
  <h2>Why</h2>
  <p>Contracts from Eraser are promises. Bruno <strong>turns them into executable checks</strong>. That's <strong>contract testing</strong>: verifying the real API still matches the agreed request/response shapes. Because <code>.bru</code> files are plain text, every API change shows up in pull-request diffs next to the code that caused it. Postman cloud collections don't give you that.</p>
  <p class="analogy">Testing by clicking through the browser is like sniffing for smoke every night before bed. A Bruno collection in CI is a smoke detector: you install it once and it checks every time, including the error paths you'd never click by hand.</p>
  <div class="callout bad"><p><strong>What breaks downstream if you skip it:</strong></p>
  <ul>
    <li><strong>Figma:</strong> designers never see real responses, so Populated and Error states use invented fields and copy.</li>
    <li><strong>Plane:</strong> there are no failing requests to turn into precise tickets ("POST /api/loans returns 500 instead of 409").</li>
    <li><strong>Code + Sentry:</strong> regressions in 4xx paths ship silently. They aren't exceptions, so Sentry won't catch them either.</li>
  </ul></div>
</section>

    <div><b>DevOps / Platform</b>Runs <code>bru run</code> in CI against a seeded database.</div>
    <div><b>Frontend Engineer</b>Uses the collection as living documentation of real payloads.</div>

<section class="card" data-sec="steps">
  <h2>Inside the tool</h2>
  <ol class="steps">
    <li>Download and install the Bruno desktop app from <strong>usebruno.com/downloads</strong>, then open it.</li>
    <li>On the home screen, click <strong>Create Collection</strong>. Name: <code>[Project]</code>. Location: <strong>your repo root</strong>. If a <em>Folder Name</em> field appears, set it to <code>bruno</code>. (If your version has no such field, close Bruno, rename the created folder to <code>bruno</code>, reopen Bruno, and use <strong>Open Collection</strong>.) Bruno writes <code>bruno/bruno.json</code>.</li>
    <li>Create an environment: open the <strong>environment dropdown</strong> (top right, "No Environment") → <strong>Configure</strong> → <strong>Create</strong>, and name it <code>local</code>.</li>
    <li>Add the variable <code>baseUrl</code> = <code>http://localhost:3000</code> (or <code>:8000</code> for Python). Add <code>email</code> and <code>password</code>, and tick <strong>Secret</strong> on <code>password</code>. Secret values are stored on your machine, not in the <code>.bru</code> file. Click <strong>Save</strong>, then select <code>local</code> in the dropdown.</li>
    <li>Right-click the collection in the sidebar → <strong>New Folder</strong> → <code>auth</code>. Repeat for each resource (<code>tools</code>, <code>loans</code>).</li>
    <li>Right-click <code>auth</code> → <strong>New Request</strong> → type <strong>HTTP</strong>, name <code>Login</code>, method <strong>POST</strong>, URL <code>{{baseUrl}}/api/auth/login</code>.</li>
    <li>Open the <strong>Body</strong> tab → choose <strong>JSON</strong> → type the request with variables: <code>{ "email": "{{email}}", "password": "{{password}}" }</code>.</li>
    <li>Open the <strong>Vars</strong> tab → <strong>Post Response</strong> → add <code>token</code> with value <code>res.body.token</code>. Every later request can now use <code>{{token}}</code>.</li>
    <li>Open the <strong>Assert</strong> tab → add <code>res.status</code> <code>eq 200</code> and <code>res.body.token</code> <code>isString</code>.</li>
    <li>Press <kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>Enter</kbd> to send. Check the response pane and the assertion results (green/red).</li>
    <li>Set auth once for the whole collection: click the collection → <strong>Settings</strong> → <strong>Auth</strong> tab → <strong>Bearer Token</strong> → <code>{{token}}</code>. In each request's <strong>Auth</strong> tab, choose <strong>Inherit</strong>. Set Login's auth to <strong>No Auth</strong>.</li>
    <li>Create one request per endpoint from the Eraser table, then one <strong>negative request per error code</strong> (for example <em>Create loan — tool unavailable</em> expecting 409). Name them so the expected outcome is obvious.</li>
    <li>For assertions that need logic, use the <strong>Tests</strong> tab (JavaScript with Chai-style <code>expect</code>).</li>
    <li>Order matters for chaining: drag requests in the sidebar so Login runs first. Bruno stores this as <code>seq</code> in each file.</li>
    <li>Right-click the collection → <strong>Run</strong>. The Runner executes everything in order and shows pass/fail per request. Fix until it's all green against your seeded local DB.</li>
    <li>Install the CLI and run it headless: <code>npm i -D @usebruno/cli</code>, then <code>cd bruno &amp;&amp; npx bru run --env local</code>. Add the same command to CI.</li>
    <li>Commit the whole <code>bruno/</code> folder. If you use <code>{{process.env.X}}</code> variables from a <code>bruno/.env</code> file, add that file to <code>.gitignore</code>.</li>
  </ol>
  <div class="callout warn">
    <p><strong>Cookie-session auth (NextAuth / Auth.js, Django sessions):</strong> there's no token to copy. The flow is (1) <code>GET {{baseUrl}}/api/auth/csrf</code> and save <code>res.body.csrfToken</code> as a var, then (2) <code>POST {{baseUrl}}/api/auth/callback/credentials</code> with <strong>Form URL Encoded</strong> body <code>csrfToken</code>, <code>email</code>, <code>password</code>. The response sets the session cookie. Recent Bruno versions keep a cookie jar and resend cookies automatically for the same domain. If yours doesn't, read <code>res.headers['set-cookie']</code> in a post-response script and set a <code>Cookie</code> header with <code>bru.setVar</code>. Django: get the <code>csrftoken</code> cookie first, then POST the login form with an <code>X-CSRFToken</code> header.</p>
  </div>
</section>

  auth: inherit
}

<section class="card" data-sec="terms">
  <h2>Key terms</h2>
  <dl class="terms">
    <dt>API collection</dt><dd>An organized set of saved HTTP requests for one API.</dd>
    <dt>Environment</dt><dd>A named set of variables (<code>baseUrl</code>, credentials) so the same requests run against local, CI, or staging.</dd>
    <dt>Contract testing</dt><dd>Automatically checking that a provider (your API) still honors the agreed request/response shapes.</dd>
    <dt>Assertion</dt><dd>A single true/false check on a response (<code>res.status eq 201</code>).</dd>
    <dt>Happy path</dt><dd>The scenario where everything goes right.</dd>
    <dt>Negative test</dt><dd>A request designed to fail in a specific, expected way (wrong password → 401).</dd>
    <dt>Request chaining</dt><dd>Passing values from one response into later requests (token, created id).</dd>
    <dt>Runtime variable</dt><dd>A variable set during a run by scripts or post-response vars. It isn't saved to disk.</dd>
    <dt>Bearer token</dt><dd>A credential sent as <code>Authorization: Bearer &lt;token&gt;</code>. Whoever holds (bears) it gets access.</dd>
    <dt>Session cookie</dt><dd>A server-issued cookie identifying a logged-in session. The browser (or Bruno's cookie jar) resends it automatically.</dd>
    <dt>CSRF token</dt><dd>A per-session secret that proves a form submission came from your own site. Needed for cookie-auth logins.</dd>
    <dt>Smoke test</dt><dd>A fast, shallow run over every endpoint to prove nothing is on fire.</dd>
    <dt>CI</dt><dd>Continuous Integration: automatically running checks (lint, tests, collections) on every push or PR.</dd>
  </dl>
</section>

<section class="card" data-sec="dod">
  <h2>Definition of Done</h2>
  <ul class="dod">
    <li data-dod="committed"><code>bruno/</code> collection committed in the repo, with <code>bruno.json</code>.</li>
    <li data-dod="envs"><code>local</code> and <code>ci</code> environments exist. Secrets are marked secret or read from <code>process.env</code>.</li>
    <li data-dod="auth">The auth request runs first, and every other request reuses the credential through inherit/vars.</li>
    <li data-dod="every">One request per endpoint in the Eraser contract table.</li>
    <li data-dod="negative">At least one negative request per documented error code (401/403/404/409/422).</li>
    <li data-dod="assert">Every request asserts the status code <em>and</em> the body shape.</li>
    <li data-dod="replay">Every idempotent endpoint has a replay test.</li>
    <li data-dod="green"><code>bru run --env local</code> passes against freshly seeded data.</li>
    <li data-dod="reconciled">Built endpoints reconciled against the contracts, with mismatches logged as gaps.</li>
  </ul>
</section>

<section class="card" data-sec="handoff">
  <h2>Handoff → Figma</h2>
  <p>For every screen that calls the API, bring:</p>
  <ol>
    <li><strong>A real response body</strong> (copy it from Bruno's response pane). This is the content of the Populated state, including the longest realistic values.</li>
    <li><strong>Every error code that screen can receive</strong> and its <code>message</code>. This drives the Error state's copy and recovery action.</li>
    <li><strong>Observed latency</strong> (shown in Bruno's response pane). Under ~100 ms you may skip a skeleton. Above ~300 ms the Loading state is mandatory.</li>
    <li><strong>Empty responses</strong> (<code>items: []</code>). These define the Idle/empty state.</li>
  </ol>
</section>

<template id="t-figma">
<section class="card" data-sec="what">
  <h2>What</h2>
  <p>For every <strong>key screen</strong> (a screen that serves an MVP story), four frames, combined into one <strong>component set</strong> with a <code>State</code> variant property:</p>
  <div class="table-wrap"><table>
    <tr><th>State</th><th>When the user sees it</th><th>Must contain</th></tr>
    <tr><td><strong>Idle</strong></td><td>Nothing to show yet: first visit, zero results, or before a search. Also called the <em>empty state</em>.</td><td>One sentence explaining the emptiness + one primary action ("List the first tool").</td></tr>
    <tr><td><strong>Loading</strong></td><td>Request in flight.</td><td>Skeleton placeholders with the <em>same size</em> as the real content. Actions disabled.</td></tr>
    <tr><td><strong>Populated</strong></td><td>Data arrived.</td><td>Real data shapes from Bruno, including the longest realistic values and a "many items" variant.</td></tr>
    <tr><td><strong>Error</strong></td><td>Request failed (network, 4xx, 5xx).</td><td>Human copy mapped from the error code, a recovery action ("Try again"), page chrome still visible.</td></tr>
  </table></div>
</section>

<section class="card" data-sec="why">
  <h2>Why</h2>
  <p>Designers naturally draw only the Populated state, because it's the pretty one. Developers then improvise the other three under deadline pressure. Users get spinners that shift the layout, buttons that can be double-clicked during loading (two loans!), blank pages on errors, and "undefined" on empty lists.</p>
  <p class="analogy">A weather app that only has graphics for sunny days. It looks great in the demo. On the first rainy day it shows a blank screen, and everyone notices.</p>
  <div class="callout bad"><p><strong>What breaks downstream if you skip it:</strong></p>
  <ul>
    <li><strong>Prisma seed:</strong> you don't know which data scenarios to seed (empty user, user with 50 items, conflicting loan), so the non-happy states are never exercised locally.</li>
    <li><strong>Plane:</strong> tickets say "build catalog page" with no acceptance criteria for loading or failure.</li>
    <li><strong>Code:</strong> missing <code>loading.tsx</code>/<code>error.tsx</code> or an error boundary means one failed fetch takes down the whole page.</li>
  </ul></div>
</section>

<section class="card" data-sec="steps">
  <h2>Inside the tool</h2>
  <ol class="steps">
    <li>In Figma, create a <strong>Design file</strong> and name it <code>[Project] — UI States</code>.</li>
    <li>In the left <strong>Pages</strong> panel, click <strong>+</strong> to add pages named <code>Screens</code> and <code>Components</code>.</li>
    <li>On <em>Screens</em>, press <kbd>F</kbd> (Frame) and pick a preset in the right panel: <strong>Desktop</strong> (1440 wide) or a phone preset (around 390 wide). Use one size consistently.</li>
    <li>Name the frame <code>Catalog / Populated</code> (double-click the frame name). Slash naming groups frames by screen.</li>
    <li>Build Populated first, with <strong>content from Bruno's real responses</strong> (paste real names and values). Use <strong>Auto layout</strong> (<kbd>Shift</kbd>+<kbd>A</kbd>) on lists and cards so they reflow with long text. Include one item with a long name.</li>
    <li>Select the frame and press <kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>D</kbd> three times. Rename the copies <code>Catalog / Idle</code>, <code>Catalog / Loading</code>, <code>Catalog / Error</code>.</li>
    <li><strong>Idle:</strong> delete the list. Add an empty-state block: icon or illustration placeholder, one sentence ("No tools in your building yet."), and a primary button ("List the first tool").</li>
    <li><strong>Loading:</strong> replace each card's text and image with gray rectangles (<kbd>R</kbd>), corner radius matching the real elements and <strong>exactly the same size</strong>. Set buttons to a disabled style.</li>
    <li><strong>Error:</strong> keep the header and navigation. Replace the list with an inline error message using copy from the error-code table, plus a <strong>Try again</strong> button. Never show raw codes or stack traces.</li>
    <li>Select all four frames → right-click → <strong>Create multiple components</strong>. With the four components still selected, click <strong>Combine as variants</strong> in the right panel.</li>
    <li>In the right panel, rename the variant property from <code>Property 1</code> to <code>State</code>, and set its values to <code>Idle</code>, <code>Loading</code>, <code>Populated</code>, <code>Error</code>.</li>

    <li>Repeat steps 3–12 for each key screen.</li>

    <li>To verify built states in the browser: DevTools → <strong>Network</strong> → throttling <strong>Slow 4G</strong> (shows Loading), <strong>Offline</strong> or right-click a request → <strong>Block request URL</strong> (shows Error), and log in as a seeded empty user (shows Idle).</li>

import { useEffect, useState } from "react";

export default function Catalog() {
  const [state, setState] = useState({ status: "loading", items: [], error: null });

  const load = () => {
    setState({ status: "loading", items: [], error: null });
    fetch("/api/tools?limit=20")
      .then(async (r) => (r.ok ? r.json() : Promise.reject(await r.json())))
      .then((data) => setState({ status: data.items.length ? "populated" : "idle", items: data.items, error: null }))
      .catch((e) => setState({ status: "error", items: [], error: e?.error?.code ?? "NETWORK" }));
  };
  useEffect(load, []);

  if (state.status === "loading") return <SkeletonGrid count={6} />;
  if (state.status === "error") return <ErrorPanel code={state.error} onRetry={load} />;
  if (state.status === "idle") return <EmptyState text="No tools in your building yet." cta="/tools/new" />;
  return <ToolGrid items={state.items} />;
}

<section class="card" data-sec="terms">
  <h2>Key terms</h2>
  <dl class="terms">
    <dt>UI state</dt><dd>A distinct visual condition of a screen, driven by data or request status.</dd>
    <dt>Empty state</dt><dd>What a screen shows when there's no data. In this pipeline it's part of <em>Idle</em>.</dd>
    <dt>Skeleton screen</dt><dd>Gray placeholders shaped like the real content, shown while loading. It feels faster than a spinner and prevents layout shift.</dd>
    <dt>Layout shift (CLS)</dt><dd>Content jumping around as it loads. Cumulative Layout Shift is the Core Web Vitals metric for it.</dd>
    <dt>Error boundary</dt><dd>A component that catches render errors in its subtree and shows a fallback instead of crashing the whole page (Next.js: <code>error.tsx</code>).</dd>
    <dt>Component / Variant / Component set</dt><dd>In Figma: a reusable element, one version of it, and the group of versions switched by a property (<code>State=Error</code>).</dd>
    <dt>Auto layout</dt><dd>Figma's flexbox-like layout. Frames grow and shrink with their content.</dd>
    <dt>Double submit</dt><dd>A user clicking an action twice during loading, creating duplicates. Prevented with disabled buttons plus server-side idempotency.</dd>
    <dt>Design handoff</dt><dd>The moment designs become implementation specs, with states, spacing, copy, and behavior annotated.</dd>
    <dt>State matrix</dt><dd>A screens × states table showing designed, built, and missing cells.</dd>
  </dl>
</section>

<section class="card" data-sec="what">
  <h2>What</h2>
  <p>Three things that turn the ERD into a real, reproducible database:</p>
  <ol>
    <li><strong>Models as code:</strong> <code>prisma/schema.prisma</code> (or the stack equivalent) with every entity, field type, relation, enum, unique constraint, and index.</li>
    <li><strong>Migrations:</strong> versioned SQL files generated from the models, applied in order to every database (local, CI, production).</li>
    <li><strong>A seed script:</strong> a <em>deterministic</em>, <em>idempotent</em> script using Faker that creates named personas and the data scenarios Figma needs. You inspect the result visually in <strong>Prisma Studio</strong>.</li>
  </ol>
  <div class="callout" data-only="Python"><p><strong>Python equivalent:</strong> SQLAlchemy 2.0 models + <strong>Alembic</strong> migrations + a Faker seed script, inspected in pgAdmin, DBeaver, or TablePlus. Or the <strong>Django ORM</strong> + <code>makemigrations</code>/<code>migrate</code> + a <code>seed</code> management command, inspected in the <strong>Django admin</strong> (the closest thing to Prisma Studio). Record the one you use in <em>Equivalent tool</em> below.</p></div>
  <div class="callout" data-only="JS TS"><p><strong>Using Drizzle instead of Prisma?</strong> The step is the same: TypeScript schema → <code>drizzle-kit generate</code> → <code>drizzle-kit migrate</code> → Faker seed → inspect in <strong>Drizzle Studio</strong> (<code>npx drizzle-kit studio</code>). Record "Drizzle ORM + drizzle-kit" in <em>Equivalent tool</em> below.</p></div>
</section>

<section class="card" data-sec="why">
  <h2>Why</h2>
  <p>The ERD is a drawing. The database is the law. Constraints like <code>@unique</code>, foreign keys, and a partial unique index enforce business rules even when your code has a bug. Migrations make every environment's schema identical and reviewable. The seed means every developer, every CI run, and every demo starts from the <em>same known world</em>. That's what makes Bruno tests and Gherkin scenarios reproducible.</p>
  <p class="analogy">A film set. The schema is the floor plan of the set. Migrations are the construction log. The seed is the props department putting the same cup on the same table before every take, so every take can be compared fairly.</p>
  <div class="callout bad"><p><strong>What breaks downstream if you skip it:</strong></p>
  <ul>
    <li><strong>Plane:</strong> Gherkin "Given" steps can't name a known user or record, so acceptance criteria aren't reproducible.</li>
    <li><strong>Bruno / tests:</strong> results depend on whatever happens to be in your local DB. "Works on my machine."</li>
    <li><strong>Demos:</strong> "test test asdf" data, and the edge cases (overdue loan, 409 conflict) can't be shown on demand.</li>
  </ul></div>
</section>

    <div><b>Reviewer: Data / Platform Engineer</b>Indexes, constraints, migration safety on large tables.</div>
    <div><b>Requester: QA</b>Asks for the seed scenarios needed to test every state.</div>
    <div><b>Solo you</b>Rule: never change the database by hand. Every change goes through a migration.</div>

  <div data-only="JS TS">
  <ol class="steps">
    <li>Install: <code>npm i @prisma/client @prisma/adapter-pg</code> and <code>npm i -D prisma tsx @faker-js/faker dotenv</code>.</li>

    <li>Run <code>npx prisma init --datasource-provider postgresql</code>. This creates <code>prisma/schema.prisma</code> and, on Prisma 7, <code>prisma.config.ts</code>.</li>
    <li>Translate each Eraser entity into a <code>model</code> block. Each relationship line becomes a pair of relation fields (<code>owner User @relation(...)</code> on one side, <code>tools Tool[]</code> on the other). Each enum becomes an <code>enum</code> block.</li>
    <li>Add constraints from the business rules: <code>@unique</code>, <code>@@unique([a, b])</code>, <code>@@index([fk])</code> on every foreign key you filter by, and <code>onDelete: Restrict</code> where children must block deletion.</li>
    <li>Run <code>npx prisma format</code>, then <code>npx prisma migrate dev --name init</code>. Open the generated <code>prisma/migrations/*/migration.sql</code> and read it.</li>

    <li>Run <code>npx prisma db seed</code>.</li>
    <li>Run <code>npx prisma studio</code>. It opens in your browser.</li>
    <li>In Studio, click <strong>User</strong> in the model list. Check the row count and find <code>maya@lendloop.test</code> using the filter/search control.</li>
    <li>Click a relation cell (Maya's <em>tools</em>) to jump to the related records. Confirm the cardinality looks right.</li>
    <li>Try to break a rule: add a record (Add record / + row) with a duplicate email and save. You should see a unique-constraint error. That proves the constraint exists in the database.</li>
    <li>Prove determinism: run <code>npx prisma migrate reset</code> (drops the DB, reapplies all migrations, reruns the seed) and confirm the same counts and the same persona records.</li>

    <script type="text/plain" class="code" data-lang="prisma" data-title="prisma/schema.prisma (Prisma 7)">
generator client {
  provider = "prisma-client"
  output   = "../src/generated/prisma"
}

// Prisma 7: the connection URL lives in prisma.config.ts.
// Prisma 6: add  url = env("DATABASE_URL")  here and use provider = "prisma-client-js".
datasource db {
  provider = "postgresql"
}

enum ToolCategory {
  HAND
  POWER
  GARDEN
  LADDER
  OTHER
}

enum ToolCondition {
  NEW
  GOOD
  FAIR
  WORN
}

enum LoanStatus {
  ACTIVE
  RETURNED
}

model User {
  id           String   @id @default(cuid())
  email        String   @unique
  name         String
  passwordHash String
  createdAt    DateTime @default(now())
  tools        Tool[]   @relation("ToolOwner")
  loans        Loan[]   @relation("LoanBorrower")
}

model Tool {
  id          String        @id @default(cuid())
  ownerId     String
  owner       User          @relation("ToolOwner", fields: [ownerId], references: [id], onDelete: Restrict)
  name        String        @db.VarChar(140)
  description String        @default("")
  category    ToolCategory
  condition   ToolCondition
  createdAt   DateTime      @default(now())
  loans       Loan[]

  @@index([ownerId])
  @@index([createdAt])
}

model Loan {
  id             String     @id @default(cuid())
  toolId         String
  tool           Tool       @relation(fields: [toolId], references: [id], onDelete: Restrict)
  borrowerId     String
  borrower       User       @relation("LoanBorrower", fields: [borrowerId], references: [id], onDelete: Restrict)
  status         LoanStatus @default(ACTIVE)
  idempotencyKey String
  startedAt      DateTime   @default(now())
  dueAt          DateTime
  returnedAt     DateTime?
  createdAt      DateTime   @default(now())

  @@unique([borrowerId, idempotencyKey])
  @@index([toolId, status])
}

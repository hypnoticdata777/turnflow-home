import "dotenv/config";
import { faker } from "@faker-js/faker";
import bcrypt from "bcryptjs";
import { PrismaPg } from "@prisma/adapter-pg";
import { PrismaClient, ToolCategory, ToolCondition, LoanStatus } from "../src/generated/prisma/client";

if (process.env.NODE_ENV === "production" && process.env.ALLOW_SEED !== "true") {
  throw new Error("Refusing to seed a production database. Set ALLOW_SEED=true if you really mean it.");
}

const prisma = new PrismaClient({ adapter: new PrismaPg({ connectionString: process.env.DATABASE_URL! }) });
faker.seed(42); // same "random" data on every run = deterministic

const DAY = 86_400_000;
const PASSWORD = "lendloop-dev-pass"; // dev-only; documented in README

async function main() {
  // Idempotent: wipe in reverse FK order, then recreate.
  await prisma.loan.deleteMany();
  await prisma.tool.deleteMany();
  await prisma.user.deleteMany();

  const passwordHash = await bcrypt.hash(PASSWORD, 10);

  // Named personas (referenced by Gherkin "Given" steps and Bruno envs)
  const maya = await prisma.user.create({ data: { email: "maya@lendloop.test", name: "Maya", passwordHash } }); // Populated
  const leo = await prisma.user.create({ data: { email: "leo@lendloop.test", name: "Leo", passwordHash } });    // owner of the busy drill
  await prisma.user.create({ data: { email: "nora@lendloop.test", name: "Nora", passwordHash } });              // Idle: nothing at all

  // Background crowd
  const crowd = await Promise.all(
    Array.from({ length: 20 }, () =>
      prisma.user.create({
        data: { email: faker.internet.email().toLowerCase(), name: faker.person.firstName(), passwordHash },
      }),
    ),
  );

  // Edge + conflict records
  const drill = await prisma.tool.create({
    data: { ownerId: leo.id, name: "Cordless drill", category: ToolCategory.POWER, condition: ToolCondition.GOOD },
  });
  await prisma.tool.create({
    data: { ownerId: leo.id, name: faker.string.alpha(120), category: ToolCategory.OTHER, condition: ToolCondition.FAIR }, // long-name edge case
  });
  await prisma.tool.create({
    data: { ownerId: leo.id, name: "Ladder 6ft", category: ToolCategory.LADDER, condition: ToolCondition.GOOD }, // always available
  });
  for (let i = 0; i < 3; i++) {
    await prisma.tool.create({
      data: {
        ownerId: maya.id,
        name: faker.commerce.productName(),
        category: faker.helpers.enumValue(ToolCategory),
        condition: faker.helpers.enumValue(ToolCondition),
      },
    });
  }

  // 60 more tools for pagination
  const tools = await Promise.all(
    Array.from({ length: 60 }, () =>
      prisma.tool.create({
        data: {
          ownerId: faker.helpers.arrayElement(crowd).id,
          name: faker.commerce.productName(),
          description: faker.commerce.productDescription(),
          category: faker.helpers.enumValue(ToolCategory),
          condition: faker.helpers.enumValue(ToolCondition),
        },
      }),
    ),
  );

  // Conflict: the drill is already on loan to Maya (Bruno 409 + Figma error state)
  await prisma.loan.create({
    data: { toolId: drill.id, borrowerId: maya.id, idempotencyKey: "seed-1", dueAt: new Date(Date.now() + 3 * DAY) },
  });
  // Overdue loan for Maya (red due date in My loans)
  await prisma.loan.create({
    data: { toolId: tools[0].id, borrowerId: maya.id, idempotencyKey: "seed-2", dueAt: new Date(Date.now() - 2 * DAY) },
  });
  // History
  await prisma.loan.create({
    data: {
      toolId: tools[1].id, borrowerId: maya.id, idempotencyKey: "seed-3", status: LoanStatus.RETURNED,
      startedAt: new Date(Date.now() - 20 * DAY), dueAt: new Date(Date.now() - 15 * DAY), returnedAt: new Date(Date.now() - 16 * DAY),
    },
  });

  console.log("Seeded: 23 users (maya, leo, nora + 20), 66 tools, 3 loans");
}

main()
  .catch((e) => { console.error(e); process.exit(1); })
  .finally(() => prisma.$disconnect());
    </script>

import enum
from datetime import datetime
from sqlalchemy import ForeignKey, String, Index, UniqueConstraint, text, func
from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, relationship


class Base(DeclarativeBase):
    pass


class ToolCategory(enum.Enum):
    HAND = "HAND"; POWER = "POWER"; GARDEN = "GARDEN"; LADDER = "LADDER"; OTHER = "OTHER"


class ToolCondition(enum.Enum):
    NEW = "NEW"; GOOD = "GOOD"; FAIR = "FAIR"; WORN = "WORN"


class LoanStatus(enum.Enum):
    ACTIVE = "ACTIVE"; RETURNED = "RETURNED"


class User(Base):
    __tablename__ = "users"
    id: Mapped[int] = mapped_column(primary_key=True)
    email: Mapped[str] = mapped_column(String(254), unique=True)
    name: Mapped[str] = mapped_column(String(80))
    password_hash: Mapped[str]
    created_at: Mapped[datetime] = mapped_column(server_default=func.now())
    tools: Mapped[list["Tool"]] = relationship(back_populates="owner")
    loans: Mapped[list["Loan"]] = relationship(back_populates="borrower")


class Tool(Base):
    __tablename__ = "tools"
    id: Mapped[int] = mapped_column(primary_key=True)
    owner_id: Mapped[int] = mapped_column(ForeignKey("users.id", ondelete="RESTRICT"), index=True)
    name: Mapped[str] = mapped_column(String(140))
    description: Mapped[str] = mapped_column(default="")
    category: Mapped[ToolCategory]
    condition: Mapped[ToolCondition]
    created_at: Mapped[datetime] = mapped_column(server_default=func.now(), index=True)
    owner: Mapped[User] = relationship(back_populates="tools")
    loans: Mapped[list["Loan"]] = relationship(back_populates="tool")


class Loan(Base):
    __tablename__ = "loans"
    __table_args__ = (
        UniqueConstraint("borrower_id", "idempotency_key"),
        Index("one_active_loan_per_tool", "tool_id", unique=True, postgresql_where=text("status = 'ACTIVE'")),
    )
    id: Mapped[int] = mapped_column(primary_key=True)
    tool_id: Mapped[int] = mapped_column(ForeignKey("tools.id", ondelete="RESTRICT"))
    borrower_id: Mapped[int] = mapped_column(ForeignKey("users.id", ondelete="RESTRICT"))
    status: Mapped[LoanStatus] = mapped_column(default=LoanStatus.ACTIVE)
    idempotency_key: Mapped[str] = mapped_column(String(64))
    started_at: Mapped[datetime] = mapped_column(server_default=func.now())
    due_at: Mapped[datetime]
    returned_at: Mapped[datetime | None]
    tool: Mapped[Tool] = relationship(back_populates="loans")
    borrower: Mapped[User] = relationship(back_populates="loans")

import os
from datetime import datetime, timedelta, timezone
from faker import Faker
from sqlalchemy import create_engine, delete
from sqlalchemy.orm import Session
import bcrypt
from app.models import User, Tool, Loan, ToolCategory, ToolCondition, LoanStatus

if os.getenv("APP_ENV") == "production" and os.getenv("ALLOW_SEED") != "true":
    raise SystemExit("Refusing to seed production.")

fake = Faker()
Faker.seed(42)  # deterministic
now = datetime.now(timezone.utc)
PW = bcrypt.hashpw(b"lendloop-dev-pass", bcrypt.gensalt(rounds=10)).decode()  # dev-only password


def main() -> None:
    engine = create_engine(os.environ["DATABASE_URL"])
    with Session(engine) as s, s.begin():
        for model in (Loan, Tool, User):  # idempotent: reverse FK order
            s.execute(delete(model))

        maya = User(email="maya@lendloop.test", name="Maya", password_hash=PW)
        leo = User(email="leo@lendloop.test", name="Leo", password_hash=PW)
        nora = User(email="nora@lendloop.test", name="Nora", password_hash=PW)  # Idle persona
        s.add_all([maya, leo, nora])

        drill = Tool(owner=leo, name="Cordless drill", category=ToolCategory.POWER, condition=ToolCondition.GOOD)
        long_name = Tool(owner=leo, name=fake.pystr(min_chars=120, max_chars=120), category=ToolCategory.OTHER, condition=ToolCondition.FAIR)
        ladder = Tool(owner=leo, name="Ladder 6ft", category=ToolCategory.LADDER, condition=ToolCondition.GOOD)
        crowd = [
            Tool(owner=maya if i < 3 else leo, name=fake.catch_phrase()[:140],
                 category=fake.random_element(list(ToolCategory)), condition=fake.random_element(list(ToolCondition)))
            for i in range(60)
        ]
        s.add_all([drill, long_name, ladder, *crowd])

        s.add_all([
            Loan(tool=drill, borrower=maya, idempotency_key="seed-1", due_at=now + timedelta(days=3)),       # 409 conflict
            Loan(tool=crowd[10], borrower=maya, idempotency_key="seed-2", due_at=now - timedelta(days=2)),   # overdue
            Loan(tool=crowd[11], borrower=maya, idempotency_key="seed-3", status=LoanStatus.RETURNED,
                 due_at=now - timedelta(days=15), returned_at=now - timedelta(days=16)),
        ])
    print("Seeded personas maya, leo, nora + 63 tools + 3 loans")


if __name__ == "__main__":
    main()
    </script>

<section class="card" data-sec="terms">
  <h2>Key terms</h2>
  <dl class="terms">
    <dt>ORM</dt><dd>Object-Relational Mapper: maps tables to classes/objects so you query with code (Prisma, Drizzle, SQLAlchemy, Django ORM).</dd>
    <dt>Model</dt><dd>The code definition of one table: fields, types, relations.</dd>
    <dt>Migration</dt><dd>A versioned, ordered change script that moves a database schema from one version to the next.</dd>
    <dt>Drift</dt><dd>When the live database, the migration history, and the model code disagree.</dd>
    <dt>Introspection</dt><dd>Reading an existing database's structure to generate models (<code>db pull</code>, <code>inspectdb</code>, <code>sqlacodegen</code>).</dd>
    <dt>Seed script</dt><dd>Code that fills a database with known starting data for development, tests, and demos.</dd>
    <dt>Deterministic seed</dt><dd>Seeding Faker's random generator with a fixed number so every run produces identical data.</dd>
    <dt>Idempotent seed</dt><dd>Running it twice leaves the same final state as running it once (wipe-then-create, or upsert).</dd>
    <dt>Persona record</dt><dd>A hand-named seed user (maya, nora) that represents a scenario and is referenced in tests.</dd>
    <dt>Unique constraint</dt><dd>A database guarantee that no two rows share a value (or combination of values).</dd>
    <dt>Partial unique index</dt><dd>A unique index that only applies to rows matching a condition (<code>WHERE status = 'ACTIVE'</code>). It enforces "one active loan per tool" at the database level.</dd>
    <dt>Index</dt><dd>A lookup structure that makes filters and joins on a column fast, at the cost of slightly slower writes.</dd>
    <dt>Referential action</dt><dd><code>onDelete: Restrict / Cascade / SetNull</code>: what happens to child rows when the parent is deleted.</dd>
  </dl>
</section>

  <ul class="dod">
    <li data-dod="models">Every ERD entity and relationship exists as a model with the same cardinality.</li>
    <li data-dod="constraints">Enums for closed sets. Unique constraints and indexes on lookups and FKs.</li>
    <li data-dod="rawsql">Business rules the ORM can't express are added as raw SQL in a migration.</li>
    <li data-dod="migrations">All schema changes go through generated migrations. Status shows no drift.</li>

    <li data-dod="guard">Seed refuses to run against production.</li>

<section class="card" data-sec="what">

  <p>A Plane project where every unit of work is one <strong>discrete work item</strong> (ticket). Each item has an imperative title, context that links back to its source (gap id, story, screen), <strong>Gherkin acceptance criteria</strong> (Given / When / Then), priority, labels, module, estimate, and cycle. In reverse mode there's <strong>one work item per gap</strong> from this audit.</p>

<section class="card" data-sec="why">
  <h2>Why</h2>
  <p>Steps 1–5 produced designs. Plane turns them into an <strong>ordered, testable backlog</strong>. Gherkin turns "done" from an opinion into a checklist that a person, a Playwright test, or a pytest test can execute. Small, discrete items let a 1-hour session end with something merged instead of half of something.</p>
  <p class="analogy">Recipe cards. Each card is one dish, lists exactly what's on the table before you start (Given), the one thing you do (When), and a photo of what it should look like (Then). Anyone can cook from it, and anyone can check the result.</p>
  <div class="callout bad"><p><strong>What breaks downstream if you skip it:</strong></p>
  <ul>
    <li><strong>Code:</strong> "fix loans" tickets have no stopping point. Scope creeps and PRs grow until they're unreviewable.</li>
    <li><strong>Tests:</strong> without acceptance criteria there's nothing to derive test names and assertions from.</li>
    <li><strong>Audit loop:</strong> gaps are found but never tracked, so the next audit finds the same gaps.</li>

  <h2>Inside the tool</h2>
  <ol class="steps">
    <li>Go to <strong>app.plane.so</strong> (or your self-hosted Plane), sign in, and create a <strong>workspace</strong> (its URL slug is used by the API).</li>
    <li>Click <strong>Projects</strong> → <strong>+ Add project</strong>. Name: <code>[Project]</code>. <strong>Identifier</strong>: 3–5 letters (<code>LEND</code>). Items will be keyed <code>LEND-1</code>, <code>LEND-2</code>… Set it to private and create it.</li>

    <li><strong>Settings → States:</strong> keep <em>Backlog, Todo, In Progress, Done, Cancelled</em>. Add <em>In Review</em> under the Started group if you open PRs.</li>
    <li><strong>Settings → Labels:</strong> create <code>gap</code>, <code>figjam</code>, <code>eraser</code>, <code>bruno</code>, <code>figma</code>, <code>db</code>, <code>observability</code>, <code>bug</code>, <code>tech-debt</code>.</li>
    <li><strong>Settings → Estimates:</strong> choose a points scale (1, 2, 3, 5, 8). For solo work, 1 point ≈ 1 focused hour.</li>
    <li><strong>Modules</strong> (left sidebar): create one module per backbone activity (<em>Join, Share, Discover, Borrow, Return</em>) plus <em>Audit gaps</em> and <em>Platform</em>.</li>
    <li><strong>Cycles</strong>: create one cycle per week with start and end dates (<em>W45 · Nov 3–9</em>).</li>
    <li>Create a work item: press <kbd>C</kbd> anywhere in the project (or click <strong>Add work item</strong> / <strong>New issue</strong>).</li>
    <li><strong>Title:</strong> imperative verb + outcome, under ~70 characters ("Show error state on catalog when tools fail to load").</li>
    <li><strong>Description:</strong> paste the ticket template (worked example below). For the Gherkin, type <kbd>```</kbd> to open a code block and paste the scenarios into it so indentation survives.</li>
    <li>Set the properties: <strong>State</strong> Backlog, <strong>Priority</strong> from gap impact (high → High or Urgent, medium → Medium, low → Low), <strong>Labels</strong> <code>gap</code> + the tool label, <strong>Module</strong>, <strong>Estimate</strong>.</li>
    <li>Click <strong>Create</strong>. Copy the item key (<code>LEND-7</code>) and paste it into the gap's <em>Ticket</em> field in this manual. That's the two-way link.</li>
    <li>Check each item against <strong>INVEST</strong>. If the estimate is over 3 points, split it into sub-work items or separate items.</li>
    <li>Create a saved <strong>View</strong> named <em>Open gaps</em>: filter Labels = <code>gap</code>, State ≠ Done/Cancelled, display grouped by Priority.</li>
    <li>Open the current cycle and add items in priority order until the total estimate equals this week's available hours.</li>
    <li>Optional: <strong>Workspace settings → Integrations → GitHub</strong> to link PRs to items (availability depends on plan and hosting).</li>
  </ol>
  <h3>Gherkin rules of thumb</h3>
  <ul>
    <li><strong>One Scenario = one behavior.</strong> If you need "and then also", it's two scenarios.</li>
    <li><strong>Given</strong> = state that already exists (use seed personas). <strong>When</strong> = exactly one action. <strong>Then</strong> = an observable outcome (text on screen, status code, a row in the DB).</li>
    <li>Write the <em>what</em>, not the <em>how</em>: "When Maya borrows the drill", not "When Maya clicks the blue button at the top right".</li>
    <li>Use <strong>Background</strong> for Givens shared by every scenario, and <strong>Scenario Outline + Examples</strong> when only the data changes.</li>
    <li>Every item needs at least one happy-path scenario and, where failure is possible, at least one failure scenario.</li>
  </ul>

<section class="card" data-sec="terms">
  <h2>Key terms</h2>
  <dl class="terms">
    <dt>Work item / ticket</dt><dd>One trackable unit of work with an owner, a state, and acceptance criteria.</dd>
    <dt>Acceptance criteria</dt><dd>Conditions that must be true for the item to count as done, written before the work starts.</dd>
    <dt>Gherkin</dt><dd>A structured plain-language format (Feature, Scenario, Given/When/Then) that humans read and BDD tools can execute.</dd>
    <dt>BDD</dt><dd>Behavior-Driven Development: specifying behavior as examples (scenarios) first, then implementing to pass them.</dd>
    <dt>Background</dt><dd>Givens shared by every scenario in a feature.</dd>
    <dt>Scenario Outline</dt><dd>A scenario template run once per row of an <em>Examples</em> table.</dd>
    <dt>INVEST</dt><dd>A good item is Independent, Negotiable, Valuable, Estimable, Small, Testable.</dd>
    <dt>Definition of Ready</dt><dd>What an item needs before work starts (ACs, design link, estimate). Definition of Done is what it needs before it closes.</dd>
    <dt>Cycle</dt><dd>Plane's time-box (a sprint): a fixed window with a committed set of items.</dd>
    <dt>Module</dt><dd>Plane's grouping of related items, similar to an epic or a feature area.</dd>
    <dt>Estimate / story points</dt><dd>A relative size measure. Solo, calibrate 1 point ≈ 1 focused hour.</dd>
    <dt>Three Amigos</dt><dd>Business, development, and testing perspectives reviewing an item together before work starts.</dd>
    <dt>Traceability</dt><dd>Links in both directions: gap ↔ item ↔ PR ↔ test.</dd>
  </dl>
</section>

<template id="t-codeSentry">
<section class="card" data-sec="what">
  <h2>What</h2>
  <p>The implementation of each work item, plus three things that keep it working after it ships:</p>
  <ol>
    <li><strong>Automated tests</strong> at three levels, derived from the Gherkin: <em>unit</em> (one function or rule), <em>integration</em> (an endpoint against a real database, which can be the Bruno collection), and <em>end-to-end</em> (a browser walking the skeleton).</li>
    <li><strong>A consistent error-handling strategy:</strong> validate at the boundary, map domain errors to the error envelope, and capture unexpected errors.</li>
    <li><strong>Sentry observability:</strong> errors from client <em>and</em> server, with environment, release (git SHA), readable stack traces (source maps), PII scrubbing, and an alert rule.</li>
  </ol>
  <p>The audit output for this step is four inventories: <strong>test coverage</strong>, <strong>error handling</strong>, <strong>Sentry setup status</strong>, and <strong>top risks</strong>.</p>
</section>

<section class="card" data-sec="why">
  <h2>Why</h2>
  <p>Code without tests regresses quietly. Errors without observability are invisible. Users don't file bug reports, they leave. Sentry gives each production error a stack trace, the breadcrumbs (what happened just before), the release that introduced it, and how many users it hit. That's the difference between "it's broken somewhere" and "line 42 of <code>route.ts</code>, since yesterday's deploy, 14 users".</p>
  <p class="analogy">Tests are the pilot's pre-flight checklist: they catch problems before takeoff. Sentry is the flight data recorder plus air-traffic radar: it tells you what happened in the air, where, and to whom.</p>
  <div class="callout bad"><p><strong>What breaks if you skip it:</strong></p>
  <ul>
    <li>You learn about bugs from users (or from their silence).</li>
    <li>You can't tell which deploy broke what, so rollbacks are guesses.</li>
    <li>The audit loop has no feedback: no new tickets flow back to Plane and FigJam.</li>
  </ul></div>
</section>

<section class="card" data-sec="steps">
  <h2>Inside the tool</h2>
  <h3>A. Work an item</h3>
  <ol class="steps">
    <li>Pick the top item of the current cycle and move it to <strong>In Progress</strong> in Plane.</li>
    <li>Create a branch named after the item: <code>git switch -c lend-8-validate-loan-body</code>.</li>
    <li>Turn each Gherkin scenario into a test with <strong>the scenario's name</strong>. Run it and watch it fail (red).</li>
    <li>Implement the smallest change that makes it pass (green). Then clean up (refactor) with the tests still green.</li>
    <li>Apply the error strategy: validate input at the boundary (zod/Pydantic → 422), throw typed domain errors (→ mapped status + envelope), and let unexpected errors bubble up to a single handler that returns 500 <code>INTERNAL</code> and reports to Sentry.</li>
    <li>Run the full local check (lint, typecheck, unit tests, Bruno collection) before pushing.</li>
    <li>Open a PR whose title includes the item key. Paste the Gherkin into the PR description as the test plan. After merging, move the item to <strong>Done</strong>.</li>
  </ol>
  <h3>B. Set up Sentry (once per project)</h3>
  <ol class="steps">
    <li>Go to <strong>sentry.io</strong> and sign up or log in. Click <strong>Projects</strong> → <strong>Create Project</strong>.</li>
    <li>Choose the platform: <span data-only="TS JS"><strong>Next.js</strong> (or <strong>Express</strong>/<strong>Node.js</strong> for a plain server)</span><span data-only="Python"><strong>FastAPI</strong>, <strong>Django</strong>, or <strong>Flask</strong></span>. Set alert frequency to <strong>Alert me on every new issue</strong>, name the project, and click <strong>Create Project</strong>.</li>
    <li>Copy the <strong>DSN</strong> shown on the setup page (also under <strong>Settings → Projects → [project] → Client Keys (DSN)</strong>).</li>
    <li>Install and initialize the SDK (exact code in the worked example for your stack).</li>
    <li>Put the DSN in environment variables, not in code. Set <code>environment</code> (development/staging/production) and <code>release</code> (git SHA).</li>
    <li>For readable stack traces, create an auth token (<strong>Settings → Auth Tokens</strong>) and store it as a CI secret <code>SENTRY_AUTH_TOKEN</code> <span data-only="TS JS">so the build uploads source maps</span><span data-only="Python">(Python tracebacks are readable as-is; the token is for releases/CLI)</span>.</li>
    <li>Trigger a test error (a temporary <code>/api/debug/boom</code> route that throws). In Sentry, open <strong>Issues</strong>: the error should appear within a minute with the right file and line.</li>
    <li>Turn PII off (<code>sendDefaultPii: false</code> / <code>send_default_pii=False</code>) and drop request bodies on auth routes in <code>beforeSend</code>.</li>
    <li><strong>Alerts → Create Alert → Issues</strong>: when "A new issue is created" in <em>production</em>, send an email (or Slack). Save.</li>
    <li>Remove or protect the debug route. Commit the config.</li>
  </ol>
  <h3>C. Wire it into CI</h3>
  <ol class="steps">
    <li>On every PR, CI runs: lint → typecheck (TS) → unit/integration tests with coverage → build → start the app on a seeded DB → Bruno collection.</li>
    <li>On deploy, create a Sentry release with the git SHA and upload source maps (the Sentry build plugin or <code>sentry-cli</code> does both).</li>
  </ol>
</section>

  <h3>Sentry setup</h3>
  <div data-only="TS">
    <script type="text/plain" class="code" data-lang="bash" data-title="Next.js: the wizard does most of it">
npx @sentry/wizard@latest -i nextjs
# Creates/edits: instrumentation-client.ts, sentry.server.config.ts, sentry.edge.config.ts,
# instrumentation.ts (register + onRequestError), next.config.ts (withSentryConfig),
# app/global-error.tsx, and optionally an example page to trigger a test error.

    <script type="text/plain" class="code" data-lang="typescript" data-title="sentry.server.config.ts + instrumentation.ts (what the wizard should leave you with)">
// sentry.server.config.ts
import * as Sentry from "@sentry/nextjs";

Sentry.init({
  dsn: process.env.SENTRY_DSN,
  environment: process.env.VERCEL_ENV ?? process.env.NODE_ENV,
  release: process.env.VERCEL_GIT_COMMIT_SHA,
  tracesSampleRate: 0.1,
  sendDefaultPii: false,
  beforeSend(event) {
    if (event.request?.url?.includes("/api/auth/")) delete event.request.data; // never ship credentials
    return event;
  },
});

// instrumentation.ts: without this file, server errors never reach Sentry (= GAP-CODE-01)

import { NextResponse } from "next/server";
import * as Sentry from "@sentry/nextjs";
import { CreateLoanBody } from "@/lib/contracts/loans";
import { createLoan, DomainError } from "@/lib/loans";
import { requireUser } from "@/lib/auth";

const err = (status: number, code: string, message: string, details: unknown = null) =>
  NextResponse.json({ error: { code, message, details } }, { status });

export async function POST(req: Request) {
  const user = await requireUser(req);
  if (!user) return err(401, "UNAUTHENTICATED", "Please log in.");

  const key = req.headers.get("Idempotency-Key");
  if (!key) return err(422, "VALIDATION_FAILED", "Idempotency-Key header is required.");

  const parsed = CreateLoanBody.safeParse(await req.json().catch(() => null)); // 1. boundary validation
  if (!parsed.success) return err(422, "VALIDATION_FAILED", "Invalid loan request.", parsed.error.flatten());

  try {
    const loan = await createLoan({ ...parsed.data, borrowerId: user.id, idempotencyKey: key });
    return NextResponse.json(loan, { status: 201 });
  } catch (e) {
    if (e instanceof DomainError) return err(e.status, e.code, e.message); // 2. expected domain errors
    Sentry.captureException(e);                                            // 3. unexpected: report + generic 500
    return err(500, "INTERNAL", "Something went wrong on our side.");
  }
}

# pip install "sentry-sdk[fastapi]"
import os
import sentry_sdk
from fastapi import FastAPI, Request, Header, Depends
from fastapi.exceptions import RequestValidationError
from fastapi.responses import JSONResponse
from app.contracts.loans import CreateLoanBody
from app.loans import create_loan, DomainError
from app.auth import require_user

sentry_sdk.init(
    dsn=os.getenv("SENTRY_DSN"),
    environment=os.getenv("APP_ENV", "development"),
    release=os.getenv("GIT_SHA"),
    traces_sample_rate=0.1,
    send_default_pii=False,
)  # FastAPI/Starlette integrations are enabled automatically

app = FastAPI()


def envelope(status: int, code: str, message: str, details=None) -> JSONResponse:
    return JSONResponse({"error": {"code": code, "message": message, "details": details}}, status_code=status)


@app.exception_handler(RequestValidationError)            # 1. boundary validation -> 422
async def on_validation(_: Request, exc: RequestValidationError):
    return envelope(422, "VALIDATION_FAILED", "Invalid request.", exc.errors())


@app.exception_handler(DomainError)                       # 2. expected domain errors
async def on_domain(_: Request, exc: DomainError):
    return envelope(exc.status, exc.code, exc.message)


@app.exception_handler(Exception)                         # 3. unexpected -> Sentry + generic 500
async def on_unexpected(_: Request, exc: Exception):
    sentry_sdk.capture_exception(exc)
    return envelope(500, "INTERNAL", "Something went wrong on our side.")


@app.post("/api/loans", status_code=201)
async def post_loan(body: CreateLoanBody, idempotency_key: str = Header(alias="Idempotency-Key"), user=Depends(require_user)):
    return await create_loan(body, borrower_id=user.id, idempotency_key=idempotency_key)

<section class="card" data-sec="terms">
  <h2>Key terms</h2>
  <dl class="terms">
    <dt>Unit test</dt><dd>Tests one function or rule in isolation. Fast, many of them.</dd>
    <dt>Integration test</dt><dd>Tests components together (handler + real DB). Your Bruno collection is a black-box integration suite.</dd>
    <dt>End-to-end (E2E) test</dt><dd>Drives a real browser through a user journey (Playwright). Slow, so keep a few on the walking skeleton.</dd>
    <dt>Test pyramid</dt><dd>Many unit tests, fewer integration tests, few E2E tests. It balances speed against confidence.</dd>
    <dt>Code coverage</dt><dd>The percentage of lines or branches executed by tests. A floor, not a goal: 100% coverage can still miss the wrong behavior.</dd>
    <dt>TDD (red-green-refactor)</dt><dd>Write a failing test, make it pass with minimal code, then clean up.</dd>
    <dt>Regression</dt><dd>Something that used to work and broke because of a later change.</dd>
    <dt>Observability</dt><dd>Being able to understand a system's internal state from its outputs: logs, metrics, traces, and errors.</dd>
    <dt>Error tracking</dt><dd>Collecting, grouping, and alerting on exceptions with context (Sentry's core job).</dd>
    <dt>DSN</dt><dd>Data Source Name: the URL-like key that tells the SDK which Sentry project to send events to. It's public-safe, but keep it in env vars.</dd>
    <dt>Source maps</dt><dd>Files that map minified production JS back to your original source, so stack traces show real file and line numbers.</dd>
    <dt>Release</dt><dd>A version tag (git SHA) attached to events, so you know which deploy introduced an error.</dd>
    <dt>Breadcrumbs</dt><dd>The trail of events (clicks, requests, logs) Sentry records before an error.</dd>
    <dt>Sampling rate</dt><dd>The fraction of transactions sent for performance tracing (0.1 = 10%). It controls cost and volume.</dd>
    <dt>PII scrubbing</dt><dd>Removing personally identifiable information (emails, passwords, IPs) before events leave your server.</dd>
    <dt>Swallowed error</dt><dd>An exception caught and ignored (empty catch). The failure happens silently.</dd>
    <dt>MTTR</dt><dd>Mean Time To Recovery: how long from an incident starting to it being fixed. Observability shrinks it.</dd>
  </dl>
</section>

  <ul class="dod">
    <li data-dod="tests">Every item in the cycle has a PR with tests named after its Gherkin scenarios.</li>
    <li data-dod="pyramid">Unit tests for domain rules, integration tests (or Bruno in CI) for every endpoint, and at least one E2E test on the walking skeleton.</li>
    <li data-dod="coverage">Coverage measured and recorded, with critical modules above 0%.</li>
    <li data-dod="validation">Input validated at every write boundary. One consistent error envelope.</li>
    <li data-dod="noswallow">No empty catch blocks or bare excepts. Unexpected errors go to Sentry.</li>
    <li data-dod="sentry">Sentry on client and server, with environment and release set, source maps uploaded, and PII off.</li>
    <li data-dod="alert">An alert rule routes new production issues to you. A test error was verified end to end.</li>
    <li data-dod="ci">CI runs lint, typecheck, tests, and the Bruno collection on every PR.</li>
    <li data-dod="inventory">Test, error-handling, and Sentry inventories plus top risks recorded in this step.</li>

  const TOOL_KEYS = ["status", "equivalentTool", "planned", "built", "gaps", "artifacts", "evidence", "notes"];
  const GAP_RE = /^GAP-(FIGJAM|ERASER|BRUNO|FIGMA|PRISMA|PLANE|CODE)-\d{2,3}$/;

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const main = $("#main");
  const sidebar = $("#sidebar");

  // ------------------------------------------------------------------ helpers
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Date().toISOString().slice(0, 10);
  const uid = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const slug = (s) => String(s || "project").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "project";
  const toolByKey = (k) => TOOLS.find((t) => t.key === k);
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const isStr = (v) => typeof v === "string";

  function dedent(text) {
    const lines = text.replace(/\t/g, "  ").split("\n");
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    const indents = lines.filter((l) => l.trim()).map((l) => l.match(/^ */)[0].length);
    const min = indents.length ? Math.min(...indents) : 0;
    return lines.map((l) => l.slice(min)).join("\n");
  }

  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied to clipboard");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); toast("Copied to clipboard"); } catch (e2) { toast("Copy failed: select the text and copy manually"); }
      ta.remove();
    }
  }

  function download(filename, text, type) {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  // ------------------------------------------------------------------ template metadata (questions + DoD per tool)
  const META = {};
  for (const t of TOOLS) {
    const tpl = document.getElementById("t-" + t.key);
    const norm = (el) => el.textContent.replace(/\s+/g, " ").trim();
    META[t.key] = {
      questions: $$("[data-q]", tpl.content).map((el) => ({ id: el.dataset.q, text: norm(el) })),
      dod: $$("[data-dod]", tpl.content).map((el) => ({ id: el.dataset.dod, text: norm(el) })),
    };
  }

  // ------------------------------------------------------------------ audit model
  function blankTool() {
    return { status: "Not planned", planned: [], built: [], gaps: [], artifacts: [], evidence: [], notes: "" };
  }
  function blankAudit(name, stack) {
    return {
      schemaVersion: SCHEMA_VERSION,
      project: { name, repoUrl: "", stack, framework: "", keyLibraries: [], auditDate: today(), auditedBy: "", notes: "" },
      tools: Object.fromEntries(TOOLS.map((t) => [t.key, blankTool()])),
      topGaps: [],
    };
  }
  // Fill defaults so the UI can rely on every field existing. Keeps x- keys.
  function normalize(doc) {
    const d = clone(doc);
    for (const t of TOOLS) {
      const ta = d.tools[t.key];
      for (const f of ["planned", "built"]) ta[f] = ta[f].map((x) => ({ text: x.text, evidence: x.evidence || [], inferred: !!x.inferred }));
      ta.gaps = ta.gaps.map((g) => {
        const o = { id: g.id, text: g.text, impact: g.impact, evidence: g.evidence || [], inferred: !!g.inferred };
        if (g.ticketRef) o.ticketRef = g.ticketRef;
        return o;
      });
    }
    if (!Array.isArray(d.topGaps)) d.topGaps = [];
    return d;
  }

  function computeStatus(ta) {
    if (!ta.planned.length) return "Not planned";
    if (!ta.built.length) return "Missing";
    if (ta.gaps.some((g) => g.impact === "high" || g.impact === "medium")) return "Partial";
    return "Matches";
  }

  function dodProgress(ta, key) {
    const total = META[key].dod.length;
    const done = META[key].dod.filter((d) => ta["x-dod"] && ta["x-dod"][d.id]).length;
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  }

  function allGaps(audit) {
    const out = [];
    for (const t of TOOLS) for (const g of audit.tools[t.key].gaps) out.push({ ...g, tool: t });
    return out;
  }
  function rankedGaps(audit) {
    const gaps = allGaps(audit);
    const pos = new Map((audit.topGaps || []).map((id, i) => [id, i]));
    const imp = (g) => IMPACTS.indexOf(g.impact);
    return gaps.sort((a, b) => {
      const pa = pos.has(a.id) ? pos.get(a.id) : Infinity, pb = pos.has(b.id) ? pos.get(b.id) : Infinity;
      if (pa !== pb) return pa - pb;
      if (imp(a) !== imp(b)) return imp(a) - imp(b);
      return a.tool.step - b.tool.step;
    });
  }

  function nextGapId(audit, tool) {
    let max = 0;
    for (const g of allGaps(audit)) {
      const m = g.id.match(new RegExp("^GAP-" + tool.prefix + "-(\\d+)$"));
      if (m) max = Math.max(max, parseInt(m[1], 10));
    }
    return "GAP-" + tool.prefix + "-" + String(max + 1).padStart(2, "0");
  }

  // Findings <-> text lines:  "~ text @ path, path"
  function findingsToText(arr) {
    return arr.map((f) => (f.inferred ? "~ " : "") + f.text + (f.evidence && f.evidence.length ? " @ " + f.evidence.join(", ") : "")).join("\n");
  }
  function textToFindings(txt) {
    return txt.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
      let inferred = false;
      if (l.startsWith("~")) { inferred = true; l = l.slice(1).trim(); }
      let text = l, evidence = [];
      const i = l.lastIndexOf(" @ ");
      if (i >= 0) {
        text = l.slice(0, i).trim();
        evidence = l.slice(i + 3).split(",").map((s) => s.trim()).filter(Boolean);
      }
      return { text, evidence, inferred };
    }).filter((f) => f.text);
  }
  const lines = (txt) => txt.split("\n").map((s) => s.trim()).filter(Boolean);
  const csv = (txt) => txt.split(",").map((s) => s.trim()).filter(Boolean);

  // ------------------------------------------------------------------ validation (mirrors project-audit.schema.json v1 + the rules it can't express)
  function validateAudit(d) {
    const E = [], W = [];
    const allow = (o, keys, path, allowX) => {
      for (const k of Object.keys(o)) if (!keys.includes(k) && !(allowX && k.startsWith("x-"))) E.push(`${path}: unknown key "${k}"`);
    };
    const strArr = (v, path) => {
      if (!Array.isArray(v)) { E.push(`${path}: must be an array of strings`); return; }
      v.forEach((s, i) => { if (!isStr(s)) E.push(`${path}[${i}]: must be a string`); });
    };
    if (!isObj(d)) return { errors: ["The root must be a JSON object."], warnings: [] };

    if (d.schemaVersion === undefined) E.push("schemaVersion: missing");
    else if (typeof d.schemaVersion !== "number") E.push("schemaVersion: must be a number");
    else if (d.schemaVersion > SCHEMA_VERSION) E.push(`schemaVersion ${d.schemaVersion} is newer than this Field Manual supports (${SCHEMA_VERSION}). Update the manual first.`);
    else if (d.schemaVersion !== SCHEMA_VERSION) E.push(`schemaVersion ${d.schemaVersion} is not supported (no migration exists).`);
    allow(d, ["schemaVersion", "project", "tools", "topGaps"], "(root)", true);

    const p = d.project;
    if (!isObj(p)) E.push("project: missing or not an object");
    else {
      allow(p, PROJECT_KEYS, "project", true);
      if (!isStr(p.name) || !p.name.trim()) E.push("project.name: required, non-empty string");
      if (!isStr(p.repoUrl)) E.push("project.repoUrl: required string (may be empty)");
      if (p.commit !== undefined && !(isStr(p.commit) && /^[0-9a-f]{7,40}$/.test(p.commit))) E.push("project.commit: must be 7–40 lowercase hex characters");
      if (!STACKS.includes(p.stack)) E.push("project.stack: must be one of JS, TS, Python");
      if (!isStr(p.framework)) E.push("project.framework: required string");
      if (p.keyLibraries === undefined) E.push("project.keyLibraries: required"); else strArr(p.keyLibraries, "project.keyLibraries");
      if (!isStr(p.auditDate) || !/^\d{4}-\d{2}-\d{2}$/.test(p.auditDate)) E.push("project.auditDate: required, format YYYY-MM-DD");
      for (const k of ["auditedBy", "notes"]) if (p[k] !== undefined && !isStr(p[k])) E.push(`project.${k}: must be a string`);
    }

    const seen = new Map();
    if (!isObj(d.tools)) E.push("tools: missing or not an object");
    else {
      allow(d.tools, TOOLS.map((t) => t.key), "tools", false);
      for (const t of TOOLS) {
        const ta = d.tools[t.key], path = "tools." + t.key;
        if (!isObj(ta)) { E.push(`${path}: missing`); continue; }
        allow(ta, TOOL_KEYS, path, true);
        for (const k of ["status", "planned", "built", "gaps", "artifacts", "evidence", "notes"]) if (ta[k] === undefined) E.push(`${path}.${k}: required`);
        if (ta.status !== undefined && !STATUSES.includes(ta.status)) E.push(`${path}.status: must be one of ${STATUSES.join(", ")}`);
        if (ta.equivalentTool !== undefined && !isStr(ta.equivalentTool)) E.push(`${path}.equivalentTool: must be a string`);
        let findingsOk = true;
        for (const f of ["planned", "built"]) {
          if (ta[f] === undefined) { findingsOk = false; continue; }
          if (!Array.isArray(ta[f])) { E.push(`${path}.${f}: must be an array`); findingsOk = false; continue; }
          ta[f].forEach((it, i) => {
            const fp = `${path}.${f}[${i}]`;
            if (!isObj(it)) { E.push(`${fp}: must be an object {text, evidence, inferred}`); findingsOk = false; return; }
            allow(it, ["text", "evidence", "inferred"], fp, false);
            if (!isStr(it.text) || !it.text.trim()) E.push(`${fp}.text: required, non-empty string`);
            if (it.evidence !== undefined) strArr(it.evidence, fp + ".evidence");
            if (it.inferred !== undefined && typeof it.inferred !== "boolean") E.push(`${fp}.inferred: must be true or false`);
            if (isStr(it.text) && !(it.evidence && it.evidence.length) && !it.inferred) W.push(`${fp}: claim has no evidence and is not marked inferred ("${it.text.slice(0, 60)}")`);
          });
        }
        let gapsOk = Array.isArray(ta.gaps);
        if (ta.gaps !== undefined && !gapsOk) E.push(`${path}.gaps: must be an array`);
        if (gapsOk) ta.gaps.forEach((g, i) => {
          const gp = `${path}.gaps[${i}]`;
          if (!isObj(g)) { E.push(`${gp}: must be an object`); gapsOk = false; return; }
          allow(g, ["id", "text", "impact", "evidence", "inferred", "ticketRef"], gp, false);
          if (!isStr(g.id) || !GAP_RE.test(g.id)) E.push(`${gp}.id: must look like GAP-${t.prefix}-01`);
          else {
            if (!g.id.startsWith("GAP-" + t.prefix + "-")) W.push(`${gp}.id: "${g.id}" uses the wrong prefix for ${t.name} (expected GAP-${t.prefix}-NN)`);
            if (seen.has(g.id)) W.push(`${gp}.id: duplicate id "${g.id}" (also in ${seen.get(g.id)})`);
            seen.set(g.id, path);
          }
          if (!isStr(g.text) || !g.text.trim()) E.push(`${gp}.text: required, non-empty string`);
          if (!IMPACTS.includes(g.impact)) E.push(`${gp}.impact: must be high, medium, or low`);
          if (g.evidence !== undefined) strArr(g.evidence, gp + ".evidence");
          if (g.inferred !== undefined && typeof g.inferred !== "boolean") E.push(`${gp}.inferred: must be true or false`);
          if (g.ticketRef !== undefined && !isStr(g.ticketRef)) E.push(`${gp}.ticketRef: must be a string`);
        });
        if (ta.artifacts !== undefined) {
          if (!Array.isArray(ta.artifacts)) E.push(`${path}.artifacts: must be an array`);
          else ta.artifacts.forEach((a, i) => {
            const ap = `${path}.artifacts[${i}]`;
            if (!isObj(a)) { E.push(`${ap}: must be an object`); return; }
            allow(a, ["name", "format", "filename", "content"], ap, false);
            if (!isStr(a.name) || !a.name.trim()) E.push(`${ap}.name: required, non-empty string`);
            if (!FORMATS.includes(a.format)) E.push(`${ap}.format: must be one of ${FORMATS.join(", ")}`);
            if (a.filename !== undefined && !isStr(a.filename)) E.push(`${ap}.filename: must be a string`);
            if (!isStr(a.content)) E.push(`${ap}.content: required string`);
          });
        }
        if (ta.evidence !== undefined) strArr(ta.evidence, path + ".evidence");
        if (ta.notes !== undefined && !isStr(ta.notes)) E.push(`${path}.notes: must be a string`);
        if (findingsOk && gapsOk && STATUSES.includes(ta.status) && ta.planned && ta.built) {
          const rule = computeStatus({ planned: ta.planned, built: ta.built, gaps: ta.gaps.filter(isObj) });
          if (rule !== ta.status) W.push(`${path}.status is "${ta.status}" but the status rule gives "${rule}"`);
        }
      }
    }

    if (d.topGaps !== undefined) {
      if (!Array.isArray(d.topGaps)) E.push("topGaps: must be an array");
      else {
        const s = new Set();
        d.topGaps.forEach((id, i) => {
          if (!isStr(id) || !GAP_RE.test(id)) E.push(`topGaps[${i}]: "${id}" is not a valid gap id`);
          else if (s.has(id)) E.push(`topGaps[${i}]: duplicate "${id}"`);
          else if (!seen.has(id)) W.push(`topGaps[${i}]: "${id}" does not exist in any tool's gaps`);
          s.add(id);
        });
      }
    }
    return { errors: E, warnings: W };
  }

  // ------------------------------------------------------------------ store
  function loadStore() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.projects)) return s;
      }
    } catch (e) { /* private mode or corrupted: start fresh */ }
    return { activeId: null, projects: [] };
  }
  let store = loadStore();
  let saveTimer;
  function saveNow() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(store)); }
    catch (e) { toast("Could not save to this browser: " + e.message); }
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 250); }
  window.addEventListener("beforeunload", saveNow);

  function cur() {
    let p = store.projects.find((x) => x.id === store.activeId);
    if (!p) {
      if (!store.projects.length) store.projects.push({ id: uid(), audit: blankAudit("My project", "TS") });
      p = store.projects[0];
      store.activeId = p.id;
      saveNow();
    }
    return p;
  }
  const audit = () => cur().audit;

  function addProject(auditDoc) {
    const p = { id: uid(), audit: auditDoc };
    store.projects.push(p);
    store.activeId = p.id;
    saveNow();
    applyStack();
    return p;
  }

  // ------------------------------------------------------------------ markdown export
  function fenceFor(content) {
    const runs = content.match(/`{3,}/g) || [];
    const longest = runs.reduce((m, r) => Math.max(m, r.length), 2);
    return "`".repeat(longest + 1);
  }
  function findingMd(f) {
    return `- ${f.inferred ? "*(inferred)* " : ""}${f.text}${f.evidence && f.evidence.length ? " — " + f.evidence.map((e) => "`" + e + "`").join(", ") : ""}`;
  }
  function toolMarkdown(a, key, withHeading = true) {
    const t = toolByKey(key), ta = a.tools[key], out = [];
    const prog = dodProgress(ta, key);
    if (withHeading) out.push(`## ${t.step}. ${t.name} — ${ta.status}`, "");
    out.push(`*Artifact:* ${t.artifact}  `, `*Rule says:* ${computeStatus(ta)} · *Definition of Done:* ${prog.done}/${prog.total}`);
    if (ta.equivalentTool) out.push(`*Equivalent tool:* ${ta.equivalentTool}`);
    out.push("", "### Planned", ...(ta.planned.length ? ta.planned.map(findingMd) : ["_none_"]));
    out.push("", "### Built", ...(ta.built.length ? ta.built.map(findingMd) : ["_none_"]));
    out.push("", "### Gaps");
    if (ta.gaps.length) {
      out.push("| ID | Impact | Gap | Evidence | Ticket |", "|---|---|---|---|---|");
      for (const g of ta.gaps) out.push(`| ${g.id} | ${g.impact} | ${(g.inferred ? "(inferred) " : "") + g.text.replace(/\|/g, "\\|").replace(/\n/g, " ")} | ${(g.evidence || []).join(", ")} | ${g.ticketRef || ""} |`);
    } else out.push("_none_");
    if (ta.artifacts.length) {
      out.push("", "### Artifacts");
      for (const ar of ta.artifacts) {
        const fence = fenceFor(ar.content);
        out.push("", `#### ${ar.name}${ar.filename ? " (`" + ar.filename + "`)" : ""}`, fence + ar.format, ar.content, fence);
      }
    }
    if (ta.evidence.length) out.push("", "### Evidence", ...ta.evidence.map((e) => "- `" + e + "`"));
    if (ta.notes) out.push("", "### Notes", ta.notes);
    const ans = ta["x-answers"] || {};
    const answered = META[key].questions.filter((q) => ans[q.id] && ans[q.id].trim());
    if (answered.length) {
      out.push("", "### Guiding questions");
      for (const q of answered) out.push("", `**${q.text}**`, "", ans[q.id].trim());
    }
    out.push("", "### Definition of Done", ...META[key].dod.map((d) => `- [${ta["x-dod"] && ta["x-dod"][d.id] ? "x" : " "}] ${d.text}`));
    return out.join("\n");
  }
  function summaryMarkdown(a) {
    const out = ["## Summary", "", "| Step | Tool | Status | Rule says | Gaps (H/M/L) | DoD |", "|---|---|---|---|---|---|"];
    for (const t of TOOLS) {
      const ta = a.tools[t.key], c = (imp) => ta.gaps.filter((g) => g.impact === imp).length, p = dodProgress(ta, t.key);
      out.push(`| ${t.step} | ${t.name} | ${ta.status} | ${computeStatus(ta)} | ${c("high")}/${c("medium")}/${c("low")} | ${p.done}/${p.total} |`);
    }
    out.push("", "## Gaps ranked by impact", "");
    const gaps = rankedGaps(a);
    if (!gaps.length) out.push("_No gaps recorded._");
    gaps.forEach((g, i) => out.push(`${i + 1}. **${g.id}** (${g.impact}, ${g.tool.name}) ${g.text.replace(/\n/g, " ")}${g.ticketRef ? " → " + g.ticketRef : ""}`));
    return out.join("\n");
  }
  function auditMarkdown(a) {
    const p = a.project;
    const out = [
      `# Audit: ${p.name}`, "",
      `- **Repo:** ${p.repoUrl || "—"}${p.commit ? " @ `" + p.commit + "`" : ""}`,
      `- **Stack:** ${p.stack} · **Framework:** ${p.framework || "—"}`,
      `- **Key libraries:** ${p.keyLibraries.length ? p.keyLibraries.map((l) => "`" + l + "`").join(", ") : "—"}`,
      `- **Audit date:** ${p.auditDate}${p.auditedBy ? " · **By:** " + p.auditedBy : ""}`,
      `- **Schema:** project-audit v${a.schemaVersion}`,
    ];
    if (p.notes) out.push("", p.notes);
    out.push("", summaryMarkdown(a));
    for (const t of TOOLS) out.push("", toolMarkdown(a, t.key));
    return out.join("\n") + "\n";
  }

  // ------------------------------------------------------------------ stack + theme
  function applyStack() {
    const s = audit().project.stack;
    document.body.dataset.stack = STACKS.includes(s) ? s : "TS";
    $$("[data-stack-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.stackBtn === document.body.dataset.stack)));
  }
  $$("[data-stack-btn]").forEach((b) => b.addEventListener("click", () => {
    audit().project.stack = b.dataset.stackBtn;
    save();
    applyStack();
    const ph = $("[data-f=equivalentTool]");
    const r = route();
    if (ph && r.name === "tool") ph.placeholder = (toolByKey(r.key).equiv || {})[b.dataset.stackBtn] || "";
    if (r.name === "project") render();
    toast("Stack: " + b.dataset.stackBtn + ". Examples and commands updated");
  }));

  function readTheme() { try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; } }
  function applyTheme(t) {
    if (t === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
    $("#btnTheme").textContent = "Theme: " + t;
  }
  $("#btnTheme").addEventListener("click", () => {
    const order = ["auto", "light", "dark"];
    const next = order[(order.indexOf(readTheme()) + 1) % 3];
    try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
    applyTheme(next);
  });
  applyTheme(readTheme());

  // ------------------------------------------------------------------ routing
  function route() {
    const h = location.hash.replace(/^#\/?/, "");
    const [name, key] = h.split("/");
    if (name === "tool" && toolByKey(key)) return { name: "tool", key };
    if (name === "summary" || name === "project") return { name };
    return { name: "start" };
  }
  window.addEventListener("hashchange", () => { document.body.classList.remove("menu-open"); render(); window.scrollTo(0, 0); });
  $("#menuToggle").addEventListener("click", () => document.body.classList.toggle("menu-open"));
  main.addEventListener("click", () => document.body.classList.remove("menu-open"));

  // ------------------------------------------------------------------ header: projects
  function renderProjectSelect() {
    const sel = $("#projectSelect");
    sel.innerHTML = store.projects.map((p) => `<option value="${esc(p.id)}"${p.id === store.activeId ? " selected" : ""}>${esc(p.audit.project.name)} (${esc(p.audit.project.stack)})</option>`).join("");
  }
  $("#projectSelect").addEventListener("change", (e) => { store.activeId = e.target.value; saveNow(); applyStack(); render(); toast("Switched project"); });
  function newProject() {
    const name = prompt("Name of the new project:", "Untitled project");
    if (name === null) return;
    addProject(blankAudit(name.trim() || "Untitled project", audit().project.stack));
    location.hash = "#/project";
    render();
    toast("Project created");
  }
  function duplicateProject(id) {
    const src = store.projects.find((p) => p.id === (id || store.activeId));
    const copy = clone(src.audit);
    copy.project.name += " (copy)";
    addProject(copy);
    render();
    toast("Project duplicated");
  }
  function deleteProject(id) {
    const p = store.projects.find((x) => x.id === (id || store.activeId));
    if (!confirm(`Delete "${p.audit.project.name}"? This cannot be undone. Export JSON first if you want a backup.`)) return;
    store.projects = store.projects.filter((x) => x.id !== p.id);
    if (store.activeId === p.id) store.activeId = store.projects.length ? store.projects[0].id : null;
    cur();
    saveNow();
    applyStack();
    render();
    toast("Project deleted");
  }

  const dlg = $("#importDialog");

  function openImport() {
    pending = null;

    $("#importFile").value = "";
    $("#importReport").innerHTML = "";
    $("#importNew").disabled = $("#importReplace").disabled = true;
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }
  function closeImport() { if (typeof dlg.close === "function") dlg.close(); else dlg.removeAttribute("open"); }
  function reportHtml(res) {
    const items = [
      ...res.errors.map((e) => `<li class="err">Error: ${esc(e)}</li>`),
      ...res.warnings.map((w) => `<li class="warn">Warning: ${esc(w)}</li>`),
    ];
    const head = res.errors.length
      ? `<p class="callout bad"><strong>${res.errors.length} error(s).</strong> Fix them in the JSON and validate again.</p>`
      : `<p class="callout ok"><strong>Valid against schema v1.</strong> ${res.warnings.length ? res.warnings.length + " rule warning(s) below. You can still import." : "No rule warnings."}</p>`;
    return head + (items.length ? `<ul class="issues small">${items.join("")}</ul>` : "");
  }
  function validateImport() {
    let doc;
    try { doc = JSON.parse($("#importText").value); }
    catch (e) { $("#importReport").innerHTML = `<p class="callout bad">Not valid JSON: ${esc(e.message)}</p>`; return; }
    const res = validateAudit(doc);
    $("#importReport").innerHTML = reportHtml(res);
    pending = res.errors.length ? null : doc;
    $("#importNew").disabled = $("#importReplace").disabled = !pending;
  }
  $("#importFile").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { $("#importText").value = String(r.result); validateImport(); };
    r.readAsText(f);
  });
  $("#importValidate").addEventListener("click", validateImport);
  $("#importClose").addEventListener("click", closeImport);

  $("#importReplace").addEventListener("click", () => {

  // ------------------------------------------------------------------ enhancers for template content
  function enhanceCodeBlocks(root) {
    for (const s of $$("script.code", root)) {
      const text = dedent(s.textContent);
      const wrap = document.createElement("div");
      wrap.className = "codeblock";
      wrap.innerHTML = `<div class="cb-head"><span>${esc(s.dataset.title || "")} <span class="muted">· ${esc(s.dataset.lang || "text")}</span></span><button class="btn sm" type="button">Copy</button></div><pre><code></code></pre>`;
      $("code", wrap).textContent = text;
      $("button", wrap).addEventListener("click", () => copyText(text));
      s.replaceWith(wrap);
    }
  }

  function enhanceQuestions(root, key) {
    const ta = audit().tools[key];
    for (const el of $$("[data-q]", root)) {
      const id = el.dataset.q, hint = el.dataset.hint;
      const q = document.createElement("div");
      q.className = "q";
      const tid = `q-${key}-${id}`;
      q.innerHTML = `<label for="${tid}">${el.innerHTML}${hint ? ` <span class="hint">${esc(hint)}</span>` : ""}</label><textarea class="inp" id="${tid}" rows="3"></textarea>`;
      const area = $("textarea", q);
      area.value = (ta["x-answers"] || {})[id] || "";
      area.addEventListener("input", () => {
        ta["x-answers"] = ta["x-answers"] || {};
        if (area.value.trim()) ta["x-answers"][id] = area.value; else delete ta["x-answers"][id];
        if (!Object.keys(ta["x-answers"]).length) delete ta["x-answers"];
        save();
      });
      el.replaceWith(q);
    }
  }

  function enhanceDod(root, key, onChange) {
    const ta = audit().tools[key];
    for (const li of $$("[data-dod]", root)) {
      const id = li.dataset.dod;
      const inner = li.innerHTML;
      li.innerHTML = `<label><input type="checkbox"><span>${inner}</span></label>`;
      const cb = $("input", li);
      cb.checked = !!(ta["x-dod"] && ta["x-dod"][id]);
      cb.addEventListener("change", () => {
        ta["x-dod"] = ta["x-dod"] || {};
        if (cb.checked) ta["x-dod"][id] = true; else delete ta["x-dod"][id];
        if (!Object.keys(ta["x-dod"]).length) delete ta["x-dod"];
        save();
        onChange();
      });
    }
  }

  function cardCopyText(sec, key) {
    const s = sec.dataset.sec;
    const ta = key ? audit().tools[key] : null;
    if (sec.dataset.copy === "audit") return toolMarkdown(audit(), key);
    if (s === "tools" || s === "gaps") return summaryMarkdown(audit());
    if (s === "meta") return JSON.stringify(audit().project, null, 2);
    if (s === "questions" && key) {
      const ans = ta["x-answers"] || {};
      return META[key].questions.map((q) => `**${q.text}**\n${(ans[q.id] || "").trim() || "_(no answer yet)_"}`).join("\n\n");
    }
    if (s === "dod" && key) return META[key].dod.map((d) => `- [${ta["x-dod"] && ta["x-dod"][d.id] ? "x" : " "}] ${d.text}`).join("\n");
    sec.classList.add("copying");
    const text = sec.innerText.replace(/\n{3,}/g, "\n\n").trim();
    sec.classList.remove("copying");
    return text;
  }

  function enhanceCards(root, key) {
    for (const sec of $$("section.card", root)) {
      const h2 = $("h2", sec);
      if (!h2) continue;
      const head = document.createElement("div");
      head.className = "card-head";
      h2.replaceWith(head);
      head.appendChild(h2);
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "btn sm";
      btn.textContent = "Copy";
      btn.title = "Copy this section";
      btn.addEventListener("click", () => copyText(cardCopyText(sec, key)));
      head.appendChild(btn);
    }
  }

  // ------------------------------------------------------------------ Planned vs Built editor
  function renderEditor(container, key, onChange) {
    const a = audit(), t = toolByKey(key), ta = a.tools[key];
    const opt = (vals, v) => vals.map((x) => `<option value="${esc(x)}"${x === v ? " selected" : ""}>${esc(x)}</option>`).join("");
    container.innerHTML = `
      <div class="statusrow">
        <label class="small"><strong>Status</strong> <select class="inp" style="width:auto;display:inline-block" data-f="status">${opt(STATUSES, ta.status)}</select></label>
        <span class="rulehint" data-rule></span>
        <button class="btn sm" type="button" data-act="applyRule">Apply rule</button>
      </div>
      <div class="field"><label for="eq-${key}">Equivalent tool <span class="hint">optional: set it when this project uses a different tool for this step</span></label>
        <input class="inp" id="eq-${key}" data-f="equivalentTool" value="${esc(ta.equivalentTool || "")}" placeholder="${esc((t.equiv || {})[audit().project.stack] || "")}"></div>
      <div class="pvb">
        <div class="field"><label for="pl-${key}">Planned <span class="hint">README, docs, TODOs, issues, commits</span></label>
          <textarea class="inp mono" id="pl-${key}" rows="8" data-f="planned" placeholder="One claim per line:  text @ path, path   (start with ~ if inferred)">${esc(findingsToText(ta.planned))}</textarea></div>
        <div class="field"><label for="bu-${key}">Built <span class="hint">code, config, tests, migrations</span></label>
          <textarea class="inp mono" id="bu-${key}" rows="8" data-f="built" placeholder="One claim per line:  text @ path, path   (start with ~ if inferred)">${esc(findingsToText(ta.built))}</textarea></div>
      </div>
      <div class="field"><label>Gaps <span class="hint">id GAP-${t.prefix}-NN · impact: high = breaks users/data/security, medium = slows the team or hides bugs, low = cosmetic/docs</span></label>
        <div data-gaps></div><button class="btn sm" type="button" data-act="addGap">+ Add gap</button></div>
      <div class="field"><label>Generated artifacts <span class="hint">paste-ready outputs for this tool</span></label>
        <div data-arts></div><button class="btn sm" type="button" data-act="addArt">+ Add artifact</button></div>
      <div class="field"><label for="ev-${key}">Evidence <span class="hint">every file path consulted for this step, one per line, including where you searched and found nothing</span></label>
        <textarea class="inp mono" id="ev-${key}" rows="4" data-f="evidence">${esc(ta.evidence.join("\n"))}</textarea></div>
      <div class="field"><label for="no-${key}">Notes</label><textarea class="inp" id="no-${key}" rows="3" data-f="notes">${esc(ta.notes)}</textarea></div>`;

    const gapsEl = $("[data-gaps]", container), artsEl = $("[data-arts]", container);
    const updateRule = () => {
      const rule = computeStatus(ta), el = $("[data-rule]", container);
      el.textContent = rule === ta.status ? `✓ matches the status rule` : `Status rule gives: ${rule}`;
      el.className = "rulehint" + (rule === ta.status ? "" : " mismatch");
      onChange();
    };
    const renderGaps = () => {
      gapsEl.innerHTML = ta.gaps.map((g, i) => `
        <div class="gap-row" data-i="${i}">
          <div class="gap-grid">
            <input class="inp mono" data-g="id" value="${esc(g.id)}" aria-label="Gap id">
            <select class="inp" data-g="impact" aria-label="Impact">${opt(IMPACTS, g.impact)}</select>
            <textarea class="inp" rows="2" data-g="text" aria-label="Gap description" placeholder="What is missing or mismatched, and the consequence">${esc(g.text)}</textarea>
          </div>
          <div class="gap-grid2">
            <input class="inp mono" data-g="evidence" value="${esc((g.evidence || []).join(", "))}" placeholder="evidence: path, path" aria-label="Gap evidence">
            <input class="inp mono" data-g="ticketRef" value="${esc(g.ticketRef || "")}" placeholder="Ticket (e.g. LEND-7)" aria-label="Ticket">
            <label class="small"><input type="checkbox" data-g="inferred"${g.inferred ? " checked" : ""}> inferred</label>
            <button class="btn sm danger" type="button" data-act="delGap">Remove</button>
          </div>
        </div>`).join("") || `<p class="small muted">No gaps yet.</p>`;
    };
    const renderArts = () => {
      artsEl.innerHTML = ta.artifacts.map((ar, i) => `
        <div class="art-row" data-i="${i}">
          <div class="art-grid">
            <input class="inp" data-a="name" value="${esc(ar.name)}" placeholder="Name" aria-label="Artifact name">
            <select class="inp" data-a="format" aria-label="Format">${opt(FORMATS, ar.format)}</select>
            <input class="inp mono" data-a="filename" value="${esc(ar.filename || "")}" placeholder="filename (optional)" aria-label="Filename">
            <button class="btn sm" type="button" data-act="copyArt">Copy</button>
            <button class="btn sm danger" type="button" data-act="delArt">Remove</button>
          </div>
          <textarea class="inp mono" rows="8" data-a="content" aria-label="Artifact content" placeholder="Paste-ready content">${esc(ar.content)}</textarea>
        </div>`).join("") || `<p class="small muted">No artifacts yet.</p>`;
    };
    renderGaps();
    renderArts();
    updateRule();

    container.addEventListener("input", (e) => {
      const el = e.target;
      const f = el.dataset.f;
      if (f === "planned" || f === "built") ta[f] = textToFindings(el.value);
      else if (f === "evidence") ta.evidence = lines(el.value);
      else if (f === "notes") ta.notes = el.value;
      else if (f === "equivalentTool") { if (el.value.trim()) ta.equivalentTool = el.value; else delete ta.equivalentTool; }
      else if (el.dataset.g) {
        const g = ta.gaps[+el.closest(".gap-row").dataset.i], k = el.dataset.g;
        if (k === "id") {
          const old = g.id, nid = el.value.trim();
          g.id = nid;
          a.topGaps = (a.topGaps || []).map((x) => (x === old ? nid : x));
          el.style.borderColor = GAP_RE.test(nid) && nid.startsWith("GAP-" + t.prefix + "-") ? "" : "var(--bad)";
        } else if (k === "text") g.text = el.value;
        else if (k === "evidence") g.evidence = csv(el.value);
        else if (k === "ticketRef") { if (el.value.trim()) g.ticketRef = el.value.trim(); else delete g.ticketRef; }
      } else if (el.dataset.a) {
        const ar = ta.artifacts[+el.closest(".art-row").dataset.i], k = el.dataset.a;
        if (k === "filename") { if (el.value.trim()) ar.filename = el.value.trim(); else delete ar.filename; }
        else ar[k] = el.value;
      } else return;
      save();
      updateRule();
    });
    container.addEventListener("change", (e) => {
      const el = e.target;
      if (el.dataset.f === "status") ta.status = el.value;
      else if (el.dataset.g === "impact") ta.gaps[+el.closest(".gap-row").dataset.i].impact = el.value;
      else if (el.dataset.g === "inferred") ta.gaps[+el.closest(".gap-row").dataset.i].inferred = el.checked;
      else if (el.dataset.a === "format") ta.artifacts[+el.closest(".art-row").dataset.i].format = el.value;
      else return;
      save();
      updateRule();
    });
    container.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-act]");
      if (!btn) return;
      const act = btn.dataset.act;
      if (act === "applyRule") {
        ta.status = computeStatus(ta);
        $("[data-f=status]", container).value = ta.status;
      } else if (act === "addGap") {
        ta.gaps.push({ id: nextGapId(a, t), text: "", impact: "medium", evidence: [], inferred: false });
        renderGaps();
        const rows = $$(".gap-row", gapsEl);
        $("[data-g=text]", rows[rows.length - 1]).focus();
      } else if (act === "delGap") {
        const i = +btn.closest(".gap-row").dataset.i, id = ta.gaps[i].id;
        if (!confirm(`Remove ${id}?`)) return;
        ta.gaps.splice(i, 1);
        a.topGaps = (a.topGaps || []).filter((x) => x !== id);
        renderGaps();
      } else if (act === "addArt") {
        ta.artifacts.push({ name: "New artifact", format: t.fmt, content: "" });
        renderArts();
      } else if (act === "delArt") {
        const i = +btn.closest(".art-row").dataset.i;
        if (!confirm(`Remove artifact "${ta.artifacts[i].name}"?`)) return;
        ta.artifacts.splice(i, 1);
        renderArts();
      } else if (act === "copyArt") {
        copyText(ta.artifacts[+btn.closest(".art-row").dataset.i].content);
        return;
      } else return;
      save();
      updateRule();
    });
  }

    const p = audit().project;
    if (k === "keyLibraries") p.keyLibraries = csv(el.value);
    else if (k === "commit") {
      const v = el.value.trim().toLowerCase();
      if (v) p.commit = v; else delete p.commit;
      el.style.borderColor = !v || /^[0-9a-f]{7,40}$/.test(v) ? "" : "var(--bad)";
    } else if (k === "stack") { p.stack = el.value; applyStack(); }
    else if (k === "auditDate") { if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) p.auditDate = el.value; }
    else p[k] = el.value;
    save();
    renderProjectSelect();
    renderSidebar(route());
  }

  function renderSummary() {
    const a = audit();
    const res = validateAudit(a);
    const counts = Object.fromEntries(STATUSES.map((s) => [s, TOOLS.filter((t) => a.tools[t.key].status === s).length]));
    const gaps = rankedGaps(a);
    const byImp = (imp) => gaps.filter((g) => g.impact === imp).length;
    const dodAll = TOOLS.reduce((acc, t) => { const p = dodProgress(a.tools[t.key], t.key); acc.d += p.done; acc.t += p.total; return acc; }, { d: 0, t: 0 });
    const toolRows = TOOLS.map((t) => {
      const ta = a.tools[t.key], rule = computeStatus(ta), p = dodProgress(ta, t.key);
      const c = (imp) => ta.gaps.filter((g) => g.impact === imp).length;
      return `<tr><td>${t.step}</td><td><a href="#/tool/${t.key}">${esc(t.name)}</a>${ta.equivalentTool ? `<div class="small muted">${esc(ta.equivalentTool)}</div>` : ""}</td>
        <td><span class="pill ${ta.status.replace(" ", "-")}">${ta.status}</span></td>
        <td>${rule === ta.status ? '<span class="muted">✓</span>' : `<span class="pill ${rule.replace(" ", "-")}">${rule}</span>`}</td>
        <td>${ta.planned.length}</td><td>${ta.built.length}</td><td>${c("high")} / ${c("medium")} / ${c("low")}</td><td>${p.done}/${p.total}</td></tr>`;
    }).join("");
    const ranked = new Set(a.topGaps || []);
    const gapRows = gaps.map((g, i) => `<tr><td>${i + 1}${ranked.has(g.id) ? "" : '<span class="muted small"> (unranked)</span>'}</td><td><code>${esc(g.id)}</code></td><td><span class="pill ${g.impact}">${g.impact}</span></td>
      <td><a href="#/tool/${g.tool.key}">${esc(g.tool.name)}</a></td><td>${g.inferred ? '<em class="muted">(inferred)</em> ' : ""}${esc(g.text)}</td><td>${esc(g.ticketRef || "")}</td></tr>`).join("");
    main.innerHTML = `
      <div class="hero"><div class="kicker">Summary · You are here</div><h1>Gap report: ${esc(a.project.name)}</h1>
        <p class="sub">${esc(a.project.stack)} · ${esc(a.project.framework || "framework not set")} · audit ${esc(a.project.auditDate)}${a.project.commit ? " · @" + esc(a.project.commit) : ""}</p></div>
      <div class="sum-grid">
        <div class="stat"><div class="v">${counts["Matches"]}</div><div class="k">Matches</div></div>
        <div class="stat"><div class="v">${counts["Partial"]}</div><div class="k">Partial</div></div>
        <div class="stat"><div class="v">${counts["Missing"]}</div><div class="k">Missing</div></div>
        <div class="stat"><div class="v">${counts["Not planned"]}</div><div class="k">Not planned</div></div>
        <div class="stat"><div class="v">${gaps.length}</div><div class="k">Gaps · ${byImp("high")} high · ${byImp("medium")} med · ${byImp("low")} low</div></div>
        <div class="stat"><div class="v">${dodAll.t ? Math.round((dodAll.d / dodAll.t) * 100) : 0}%</div><div class="k">Definition of Done (${dodAll.d}/${dodAll.t})</div></div>
      </div>
      <section class="card" data-sec="tools"><h2>Status by tool</h2>
        <div class="table-wrap"><table><tr><th>#</th><th>Tool</th><th>Status</th><th>Rule says</th><th>Planned</th><th>Built</th><th>Gaps H / M / L</th><th>DoD</th></tr>${toolRows}</table></div>
      </section>
      <section class="card" data-sec="gaps"><h2>Gaps ranked by impact</h2>
        <p class="small muted">Order: the <code>topGaps</code> list first, then any unranked gaps by impact and pipeline order. "Rank by impact" rewrites <code>topGaps</code>.</p>
        <p><button class="btn" data-sact="rank">Rank by impact (write topGaps)</button> <button class="btn" data-sact="copy">Copy gap report (Markdown)</button> <button class="btn" data-sact="md">Export full Markdown</button></p>
        <div class="table-wrap"><table><tr><th>Rank</th><th>ID</th><th>Impact</th><th>Tool</th><th>Gap</th><th>Ticket</th></tr>${gapRows || '<tr><td colspan="6" class="muted">No gaps recorded yet.</td></tr>'}</table></div>
      </section>
      <section class="card" data-sec="validation"><h2>Schema &amp; rule check</h2>${reportHtml(res)}</section>`;
    enhanceCards(main, null);
  }

  main.addEventListener("input", onProjectInput);
  main.addEventListener("change", onProjectInput);

  // global click handling for buttons inside views
  main.addEventListener("click", (e) => {
    const b = e.target.closest("[data-action],[data-pact],[data-sact]");
    if (!b) return;
    const act = b.dataset.action || b.dataset.pact || b.dataset.sact;
    const id = b.dataset.id;
    if (act === "load-example" || act === "example") loadExample();
    else if (act === "import") openImport();
    else if (act === "new") newProject();
    else if (act === "open") { store.activeId = id; saveNow(); applyStack(); render(); }
    else if (act === "dup") duplicateProject(id);
    else if (act === "del") deleteProject(id);
    else if (act === "copyjson") copyText(JSON.stringify(audit(), null, 2));
    else if (act === "rank") {
      const a = audit();
      a.topGaps = allGaps(a).sort((x, y) => IMPACTS.indexOf(x.impact) - IMPACTS.indexOf(y.impact) || x.tool.step - y.tool.step).map((g) => g.id);
      save();
      render();
      toast("topGaps rewritten by impact");
    } else if (act === "copy") copyText(summaryMarkdown(audit()));
    else if (act === "md") download(slug(audit().project.name) + ".audit.md", auditMarkdown(audit()), "text/markdown");
  });

  // ------------------------------------------------------------------ render
  function render() {
    const r = route();
    cur();
    renderProjectSelect();
    renderSidebar(r);
    if (r.name === "tool") renderTool(r.key);
    else if (r.name === "summary") renderSummary();
    else if (r.name === "project") renderProject();
    else renderStart();
    document.title = (r.name === "tool" ? toolByKey(r.key).name + " · " : "") + "Pipeline Field Manual";
  }

  // keep the sidebar's sticky offset equal to the (wrapping) header height
  const topbar = $(".topbar");
  const setTopbarH = () => document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
  if (window.ResizeObserver) new ResizeObserver(setTopbarH).observe(topbar);
  setTopbarH();

  applyStack();
  render();
})();
</script>
</body>
</html>
